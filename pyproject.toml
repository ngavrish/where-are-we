[project]
name = "where-are-we"
version = "0.8.1"
description = "Stop paying your agent to grep. One tree walk writes entry points, routes, data model, step signatures, and every duplicate or dead test into AGENTS.md — or JSON for your own harness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BoberIT"}]
keywords = ["testing", "agents", "codebase-map", "behave", "pytest", "cucumber"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Optional on purpose: regexes carry the tool everywhere, and a real parser
# sharpens the two languages where they are weakest.
precise = ["tree-sitter-languages>=1.10", "tree-sitter>=0.21,<0.22"]

[project.scripts]
where-are-we = "where_are_we.mapper:main"
wawe-readmes = "where_are_we.readmes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/where_are_we"]
