      - name: "wawe-eval: the budget loses no row the map holds"
        run: |
          set -o pipefail
          rm -rf /tmp/wawe-eval
          # The same three fixtures the golden suite builds, built the same
          # way: `build_all` writes the repo and then maps it exactly as
          # `main()` does. `check.py` calls this; so does this step, rather
          # than mapping this checkout, so the numbers below are about the
          # budget and not about whatever landed in the repository this week.
          python -c "
          import sys
          sys.path.insert(0, 'tests/golden')
          import build_fixtures
          build_fixtures.build_all('/tmp/wawe-eval')
          "
          # Redirected, not piped: the exit code is the gate. wawe-eval exits
          # 1 when a budgeted answer plus its `more` handles fails to give
          # back a row the whole answer had, and 0 when every question comes
          # back whole.
          wawe-eval --map /tmp/wawe-eval/suite/out --questions 100 \
            --budgets 350,1500 > /tmp/wawe-eval-out.txt
          cat /tmp/wawe-eval-out.txt
          # An exit code of 0 also comes back from a run that measured
          # nothing, so the same run is asked for its numbers and they are
          # checked for being numbers: both budgets present, a hundred
          # questions each, every recall a fraction. Deterministic output, so
          # this is the table above in another shape, not a second sample.
          wawe-eval --map /tmp/wawe-eval/suite/out --questions 100 \
            --budgets 350,1500 --json > /tmp/wawe-eval.json
          python -c "
          import json
          report = json.load(open('/tmp/wawe-eval.json'))
          rows = report['budgets']
          assert [r['budget'] for r in rows] == [350, 1500], rows
          for r in rows:
              assert r['questions'] == 100, r
              for key in ('first_answer_recall', 'pooled_recall', 'top5_recall'):
                  v = r[key]
                  assert isinstance(v, float) and 0.0 <= v <= 1.0, (key, r)
              assert r['mean_bytes'] > 0, r
              # Rows the map holds that are longer than the budget: nothing
              # can print them there, so they are counted and named rather
              # than asserted. A number, not a claim about it.
              n = r['rows_over_budget']
              assert isinstance(n, int) and n >= 0, r
              assert sum(r['rows_over_budget_by_question'].values()) == n, r
          assert sum(report['questions_by_kind'].values()) == 100, report
          print('wawe-eval: 2 budgets, 100 questions each, every recall in [0, 1]')
          "
          # The property this step is named for needs `more` to exist. Until
          # Task 1 merges there is no handle to follow, the run says so, and
          # asserting it here would fail the build for a tool that is not in
          # it yet. Gated on the flag `more` brings with it, so the assertion
          # arms itself the moment that lands and nothing here has to change.
          if where-are-we --help | grep -q -- --more; then
            if grep -q "handles: not available in this build" /tmp/wawe-eval-out.txt; then
              echo "unexpected match: grep -q 'handles: not available in this build' /tmp/wawe-eval-out.txt"; exit 1
            fi
            python -c "
          import json
          rows = json.load(open('/tmp/wawe-eval.json'))['budgets']
          for r in rows:
              # Over the rows that fit the budget, at the budgets the MCP
              # server uses (1500 is its floor). A row longer than the
              # budget cannot be shown at it by the first answer or by
              # `more`, which reports it; it is in rows_over_budget and out
              # of this. At 350 an answer may not hold a row and a handle
              # both, so that budget is measured and printed, not asserted.
              if r['budget'] >= 1500:
                  assert r['recall_with_handles'] == 1.0, r
                  assert r['chains_cut_short'] == 0, r
              else:
                  assert r['recall_with_handles'] >= 0.95, r
          print('wawe-eval: recall with handles 1.0 over every row that fits, at 1500 and up')
          "
          fi
      - name: the more tool returns what an answer left out
        run: |
          set -o pipefail
          rm -rf /tmp/more
          mkdir -p /tmp/more/repo/steps /tmp/more/repo/features
          # One section with far more matching rows than any small budget
          # holds, so every answer below is cut and every cut prints a handle.
          python - <<'EOF'
          import pathlib
          steps = pathlib.Path("/tmp/more/repo/steps/pay_steps.py")
          body = ["from behave import step", ""]
          for i in range(1, 201):
              body += [f'@step("pay invoice {i}")',
                       f"def step_pay_invoice_{i}(context):",
                       f"    context.page.charge_{i}()", ""]
          steps.write_text("\n".join(body))
          feat = pathlib.Path("/tmp/more/repo/features/pay.feature")
          feat.write_text("Feature: Pay an invoice\n"
                          + "".join(f"  Scenario: pay invoice {i}\n"
                                    f"    Given pay invoice {i}\n"
                                    for i in range(1, 201)))
          EOF
          where-are-we --repo /tmp/more/repo --out /tmp/more/m --product none \
            --force --quiet --no-semantic
          # 1. A cut answer prints a handle, in the wording the tail contract
          #    fixes: `… N more matching rows (more:rows:<section>:<words>:<n>)`.
          where-are-we --out /tmp/more/m --ask "invoice" > /tmp/more/ask.txt
          grep -qE '… [0-9]+ more matching rows \(more:rows:[a-z0-9_-]+:invoice:[0-9]+\)' /tmp/more/ask.txt
          # 2. Every handle parses with the one regex a reader is given, and
          #    holds no space. The rows one is the handle the rest of this
          #    step follows: an `unmatched` handle answers about the rows that
          #    never matched, which is a different list on purpose.
          grep -cE '\(?(more:[a-z]+:[^)[:space:]]+)\)?' /tmp/more/ask.txt
          grep -oE '\(more:rows:[^)]+\)' /tmp/more/ask.txt | head -1 \
            | tr -d '()' > /tmp/more/handle.txt
          test -s /tmp/more/handle.txt
          cat /tmp/more/handle.txt
          # 3. `more` returns rows the answer did not print, and they are rows
          #    the unbudgeted answer holds: what was left out, not something else.
          where-are-we --out /tmp/more/m \
            --more "$(cat /tmp/more/handle.txt)" > /tmp/more/rest.txt
          python - <<'EOF'
          import pathlib, re, subprocess, sys
          sys.path.insert(0, "src")
          from where_are_we import mapper
          m = "/tmp/more/m/framework_map.md"
          HANDLE = re.compile(r"\(?(more:[a-z]+:[^)\s]+)\)?")

          def rows(answer):
              out, prefix, keep = set(), None, False
              for line in answer.splitlines():
                  if line.startswith("#"):
                      keep = not line.startswith(("## Defined here", "## Called by"))
                      prefix = None
                      continue
                  if not keep or line.startswith("…") or not line.strip():
                      continue
                  head = re.match(r"^- `([^`]*/)`$", line)
                  if head:
                      prefix = head.group(1)
                      continue
                  leaf = re.match(r"^  - `([^`]+)`(.*)$", line)
                  if leaf and prefix:
                      out.add(f"- `{prefix}{leaf.group(1)}`{leaf.group(2)}")
                      continue
                  prefix = None
                  out.add(line)
              return out

          first = pathlib.Path("/tmp/more/ask.txt").read_text()
          rest = pathlib.Path("/tmp/more/rest.txt").read_text()
          full = rows(mapper.ask(m, "invoice", 10 ** 9))
          assert rows(first) <= full, "the answer holds a row the map does not"
          assert not (rows(first) & rows(rest)), "more repeated what the answer printed"
          assert rows(rest) <= full, "more returned a row the map does not hold"

          # Chased to exhaustion, the handles reconstruct the whole row set.
          for limit in (1500, 12000):
              answer = mapper.ask(m, "invoice", limit)
              got, seen, queue = rows(answer), set(), HANDLE.findall(answer)
              calls = 0
              while queue:
                  h = queue.pop(0)
                  if h in seen or h.split(":")[1] not in ("rows", "sections"):
                      continue
                  seen.add(h)
                  more = mapper.more(m, h, limit)
                  calls += 1
                  if more.startswith("no such handle"):
                      continue
                  got |= rows(more)
                  queue += [n for n in HANDLE.findall(more) if n not in seen]
              print(f"limit {limit}: {len(rows(answer))} rows in the answer, "
                    f"{len(got)} after {calls} more() calls, {len(full)} in the map")
              assert got == full, sorted(full - got)[:3]

          # A handle against a map that no longer holds the section is stale,
          # not a slice of some other list.
          handle = pathlib.Path("/tmp/more/handle.txt").read_text().strip()
          section = handle.split(":")[2]
          for name in ("framework_map.md", "framework_map_brief.md"):
              p = pathlib.Path("/tmp/more/m2") / name
              p.parent.mkdir(exist_ok=True)
              keep, skip = [], False
              for line in (pathlib.Path("/tmp/more/m") / name).read_text().splitlines():
                  if line.startswith("## "):
                      from where_are_we.ask import _head_slug
                      skip = _head_slug(line) == section
                  if not skip:
                      keep.append(line)
              p.write_text("\n".join(keep) + "\n")
          (pathlib.Path("/tmp/more/m2") / "framework_map.json").write_bytes(
              (pathlib.Path("/tmp/more/m") / "framework_map.json").read_bytes())
          stale = mapper.more("/tmp/more/m2/framework_map.md", handle, 4000)
          print("stale:", stale)
          assert stale.startswith("no such handle in this map: "), stale
          assert "banana" not in mapper.more(m, "more:banana:x:0", 4000).split(":")[0]
          EOF
          # 4. `find`'s own tail carries a handle, and `more` continues it.
          where-are-we --out /tmp/more/m --ask "charge" > /dev/null
          python - <<'EOF'
          import re, sys
          sys.path.insert(0, "src")
          from where_are_we import mapper
          hits = mapper.find_text("/tmp/more/m", "invoice", 5)
          print(hits.splitlines()[-1])
          handle = re.search(r"\(more:find:[^)]+\)", hits).group(0).strip("()")
          rest = mapper.more("/tmp/more/m/framework_map.md", handle, 4000)
          a = {l for l in hits.splitlines() if l.startswith("- ")}
          b = {l for l in rest.splitlines() if l.startswith("- ")}
          assert a and b and not (a & b), "find's handle repeated its own hits"
          print(f"find: {len(a)} hits, {len(b)} more behind the handle, none repeated")
          EOF
          # 5. A handle carries the question, not a slug of it. A slug turned
          #    `pre-commit` into two words and `支払い処理` into nothing, so the
          #    handle re-asked the map a question nobody typed and returned
          #    rows that were not the ones left out.
          python - <<'EOF'
          import re, sys
          sys.path.insert(0, "src")
          from where_are_we import mapper
          from where_are_we.ask import _encode, _decode, _handle_words
          HANDLE = re.compile(r"\(?(more:[a-z]+:[^)\s]+)\)?")
          m = "/tmp/more/m/framework_map.md"

          for words in ("pre-commit", "where-are-we", "page.click", "pay step 1",
                        "支払い処理", "facturación"):
              field = _encode(words)
              assert " " not in field and "(" not in field and ")" not in field, field
              assert _decode(field) == words, field
              mine = [w.lower() for w in re.split(r"[\s,]+", words) if len(w) > 1]
              assert _handle_words(field)[1] == mine, (words, _handle_words(field)[1])
          print("six punctuated and non-Latin questions survive a handle whole")

          # And on the map: what the handle fetches is what the answer left out.
          words = "pay invoice"
          full = mapper.ask(m, words, 10 ** 9)
          answer = mapper.ask(m, words, 1500)
          rows = lambda s: {l for l in s.splitlines() if l.startswith("- ")}
          got, seen, queue = rows(answer), set(), HANDLE.findall(answer)
          while queue:
              h = queue.pop(0)
              if h in seen or h.split(":")[1] not in ("rows", "sections", "defs"):
                  continue
              seen.add(h)
              out = mapper.more(m, h, 1500)
              if out.startswith("no such handle"):
                  continue
              got |= rows(out)
              queue += [n for n in HANDLE.findall(out) if n not in seen]
          # `rows` here is every `- ` line, definitions included, so the
          # definitions handle is chased with the rest; `more:defs` sees past
          # the block's 40-row cap, which is why this is >= and not ==.
          assert got >= rows(full), sorted(rows(full) - got)[:3]
          print(f"{words!r}: {len(rows(answer))} rows in the answer, {len(got)} after its handles")

          # `find`'s phrase survives too, and every line it hands back holds it.
          for phrase in ("pay invoice 1", "context.page"):
              hits = mapper.find_text("/tmp/more/m", phrase, 2)
              found = re.search(r"\(more:find:[^)]+\)", hits)
              if not found:
                  continue
              rest = mapper.more(m, found.group(0).strip("()"), 4000)
              lines = [l for l in (hits + "\n" + rest).splitlines() if l.startswith("- ")]
              assert lines, phrase
              assert all(phrase.lower() in l.lower() for l in lines), phrase
              whole = [l for l in mapper.find_text("/tmp/more/m", phrase, 10 ** 6).splitlines()
                       if l.startswith("- ")]
              assert lines == whole[:len(lines)], phrase
              print(f"find {phrase!r}: {len(lines)} lines across the handle, every one holds it")

          # Every kind of `more` answer is bounded by the room it was given.
          handle = open("/tmp/more/handle.txt").read().strip()
          finds = re.search(r"\(more:find:[^)]+\)",
                            mapper.find_text("/tmp/more/m", "invoice", 2)).group(0).strip("()")
          for h in (handle, finds):
              for limit in (100, 200, 1500):
                  out = mapper.more(m, h, limit)
                  assert len(out) <= limit or out.startswith("no such handle"), \
                      (h, limit, len(out))
          print("more() answers fit the room they were given at 100, 200 and 1500")

          # A `find` chain advances at a budget too small for the long tail:
          # the tail drops to its short form, and only then its handle.
          h, seen_hits, calls = "more:find:invoice:0", 0, 0
          while h and calls < 60:
              out = mapper.more(m, h, 150)
              assert len(out) <= 150 or out.startswith("no such handle"), len(out)
              seen_hits += len([l for l in out.splitlines() if l.startswith("- ")])
              calls += 1
              nxt = re.search(r"\(more:find:[^)]+\)", out)
              h = nxt.group(0).strip("()") if nxt else ""
          assert calls > 3, f"the find chain stopped after {calls} calls at 150 characters"
          print(f"find chains at 150 characters: {calls} calls, {seen_hits} hits")

          # A long question makes a long handle. Where the handle fits, the
          # chain still reaches every row; the docstring says what happens
          # below that budget.
          rows2 = lambda s: {l for l in s.splitlines() if l.startswith("- ")}
          long_q = ("pay invoice charge step click page feature scenario " * 4)[:200]
          field = _encode(long_q)
          assert len(field) > 200 and " " not in field
          whole = rows2(mapper.ask(m, long_q, 10 ** 9))
          for limit in (4000, 12000):
              answer = mapper.ask(m, long_q, limit)
              assert len(answer) <= limit, (limit, len(answer))
              got, seen, queue = rows2(answer), set(), HANDLE.findall(answer)
              while queue:
                  hh = queue.pop(0)
                  if hh in seen or hh.split(":")[1] not in ("rows", "sections", "defs"):
                      continue
                  seen.add(hh)
                  out = mapper.more(m, hh, limit)
                  if out.startswith("no such handle"):
                      continue
                  got |= rows2(out)
                  queue += [n for n in HANDLE.findall(out) if n not in seen]
              missing = whole - got
              print(f"a {len(long_q)}-character question ({len(field)}-character "
                    f"handle field) at {limit}: {len(whole)} rows, {len(missing)} out of reach")
              assert not missing, sorted(missing)[:2]
          EOF
          # 6. Every tool the server declares, and the MCP `more` and
          # `--more` answer the same.
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"more\",\"arguments\":{\"handle\":\"$(cat /tmp/more/handle.txt)\"}}}" \
            | where-are-we --mcp --out /tmp/more/m > /tmp/more/mcp.jsonl
          python - <<'EOF'
          import json, pathlib
          rows = [json.loads(l) for l in open("/tmp/more/mcp.jsonl")]
          names = sorted(t["name"] for t in rows[0]["result"]["tools"])
          print("tools/list:", len(names), names)
          assert names == ["ask", "callees", "callers", "defines", "find",
                           "impact", "more", "sections"], names
          mcp = rows[1]["result"]["content"][0]["text"]
          cli = pathlib.Path("/tmp/more/rest.txt").read_text()
          assert mcp == cli.rstrip("\n"), "MCP more and --more disagree"
          print("MCP more and --more agree, byte for byte")
          EOF

      - name: an ambiguous edge names every file that declares the callee, and is matched without the mark
        run: |
          set -o pipefail
          rm -rf /tmp/mark /tmp/markmap
          mkdir -p /tmp/mark
          # `charge` is declared in two files. `b.ts` calls it and says
          # nothing about which one it means, so the edge names both of them,
          # sorted; `d.ts` imports it from `./a`, so its edge names `a.ts`
          # and carries no mark.
          printf 'export function charge(amount: number): string {\n  return `a ${amount}`;\n}\n' > /tmp/mark/a.ts
          printf 'export function charge(amount: number): string {\n  return `c ${amount}`;\n}\n' > /tmp/mark/c.ts
          printf 'export function payInvoice(amount: number): string {\n  return charge(amount);\n}\n' > /tmp/mark/b.ts
          printf 'import { charge } from "./a";\n\nexport function settle(amount: number): string {\n  return charge(amount);\n}\n' > /tmp/mark/d.ts
          where-are-we --repo /tmp/mark --out /tmp/markmap --product none \
            --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/markmap/framework_map.json"))
          graph = m["call_graph_files"]
          # Every candidate, sorted, so the byte is the same whatever order
          # the filesystem handed the two declarations over in.
          assert graph["b.ts:payInvoice"] == ["charge (a.ts|c.ts)?"], graph
          # An import that names one file decides it, and a decided edge
          # carries no mark.
          assert graph["d.ts:settle"] == ["charge (a.ts)"], graph
          # `a.ts` declares `charge` itself, and the pattern pass reads a
          # function's own signature line as a call: not an edge out of it.
          assert "a.ts:charge" not in graph, graph
          stats = m["call_graph_stats"]["ts_js"]
          assert stats["ambiguous"] > 0, stats
          assert stats["edges"] == 1 and stats["marked"] == 1, stats
          print("marked edge:", graph["b.ts:payInvoice"][0], stats)
          EOF
          # The mark is printed, and matched through: `callers` finds both
          # callers by the bare name, `callees` hands the mark back.
          where-are-we --out /tmp/markmap --callers charge > /tmp/mark/callers.txt
          grep -qx "b.ts:payInvoice" /tmp/mark/callers.txt
          grep -qx "d.ts:settle" /tmp/mark/callers.txt
          where-are-we --out /tmp/markmap --callees payInvoice | grep -qxF 'payInvoice: charge (a.ts|c.ts)?'
          # And every `impact` reply says what the mark means.
          where-are-we --out /tmp/markmap --impact charge --impact-depth 2 > /tmp/mark/impact.txt
          head -1 /tmp/mark/impact.txt | grep -qF "an edge ending in ? names every file that declares the callee, because more than one does."
          grep -qx "depth 1: b.ts:payInvoice, d.ts:settle" /tmp/mark/impact.txt
          # The same three rules in Python, and the same tree written twice in
          # opposite order: a call to a name this file declares is no edge, an
          # import decides between two homes, and an undecided edge names
          # both. The two maps agree byte for byte, so no byte of the graph
          # comes from the order the walk read the files in.
          rm -rf /tmp/markpy1 /tmp/markpy2
          mkdir -p /tmp/markpy1 /tmp/markpy2
          write_charge() {
            printf 'def charge(x):\n    return x\n' > "$1/$2.py"
          }
          write_rest() {
            printf 'def charge(x):\n    return x\n\n\ndef pay_local(x):\n    return charge(x)\n' > "$1/local.py"
            printf 'from aa import charge\n\n\ndef pay_imported(x):\n    return charge(x)\n' > "$1/imp.py"
            printf 'def pay_invoice(x):\n    return charge(x)\n' > "$1/z.py"
          }
          write_charge /tmp/markpy1 aa
          write_charge /tmp/markpy1 bb
          write_rest /tmp/markpy1
          write_charge /tmp/markpy2 bb
          write_charge /tmp/markpy2 aa
          write_rest /tmp/markpy2
          for d in 1 2; do
            where-are-we --repo "/tmp/markpy$d" --out "/tmp/markpy$d/out" \
              --product none --force --quiet --no-semantic
          done
          python - <<'EOF'
          import json
          maps = [json.load(open(f"/tmp/markpy{n}/out/framework_map.json"))
                  for n in (1, 2)]
          graphs = [m["call_graph_files"] for m in maps]
          assert graphs[0] == graphs[1], graphs
          graph = graphs[0]
          assert graph["z.py:pay_invoice"] == ["charge (aa.py|bb.py|local.py)?"], graph
          assert graph["imp.py:pay_imported"] == ["charge (aa.py)"], graph
          assert "local.py:pay_local" not in graph, graph
          stats = maps[0]["call_graph_stats"]["python"]
          assert stats["edges"] == 1 and stats["marked"] == 1, stats
          print("python:", graph, stats)
          EOF
          # A call through a module this tree does not declare is no edge at
          # all, whatever the tree declares by that name: `ast.walk` and
          # `os.walk` reach the standard library, and the two first-party
          # `walk` functions here are not what they reach. `mymod.walk` does
          # reach one, and names it.
          rm -rf /tmp/markmod
          mkdir -p /tmp/markmod/repo
          printf 'def walk(x):\n    return x\n' > /tmp/markmod/repo/a.py
          printf 'def walk(x):\n    return x\n' > /tmp/markmod/repo/mymod.py
          printf 'import ast\nimport os\n\n\ndef f(src):\n    return [n for n in ast.walk(ast.parse(src))] + list(os.walk(src))\n' > /tmp/markmod/repo/w.py
          printf 'import mymod\n\n\ndef g(u):\n    return mymod.walk(u)\n' > /tmp/markmod/repo/c.py
          where-are-we --repo /tmp/markmod/repo --out /tmp/markmod/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/markmod/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert "w.py:f" not in graph, graph
          assert graph == {"c.py:g": ["walk (mymod.py)"]}, graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 1 and stats["marked"] == 0, stats
          print("stdlib receiver:", graph, stats)
          EOF
          # And the answer a reader gets names the one real caller.
          where-are-we --out /tmp/markmod/out --callers walk > /tmp/markmod/callers.txt
          cat /tmp/markmod/callers.txt
          grep -qx "c.py:g" /tmp/markmod/callers.txt
          test "$(wc -l < /tmp/markmod/callers.txt)" -eq 1
          # The other way a receiver is bound. `from os import path` names a
          # module of the standard library, so `path.f(...)` is no edge; the
          # test is on the package, so `from .config import settings` keeps
          # its honest mark, because what that line binds may be an object and
          # an object is not something this pass can place.
          rm -rf /tmp/markfrom
          mkdir -p /tmp/markfrom/repo
          printf 'def f(x):\n    return x\n' > /tmp/markfrom/repo/p.py
          printf 'def f(x):\n    return x\n' > /tmp/markfrom/repo/q.py
          printf 'from os import path as m\n\n\ndef g(u):\n    return m.f(u)\n' > /tmp/markfrom/repo/aliased.py
          printf 'from os import path\n\n\ndef h(u):\n    return path.f(u)\n' > /tmp/markfrom/repo/plain.py
          printf 'settings = object()\n' > /tmp/markfrom/repo/config.py
          printf 'from .config import settings\n\n\ndef k(u):\n    return settings.f(u)\n' > /tmp/markfrom/repo/keeps.py
          where-are-we --repo /tmp/markfrom/repo --out /tmp/markfrom/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          graph = json.load(open("/tmp/markfrom/out/framework_map.json"))["call_graph_files"]
          assert graph == {"keeps.py:k": ["f (p.py|q.py)?"]}, graph
          print("from-import receiver:", graph)
          EOF
          # A directory named after an imported module is the weakest
          # evidence there is: it matches on the last part of the path at any
          # depth. `tests/fixtures/logging/` declaring no `info` does not
          # speak for `logging.info(...)`, and the two first-party `info`
          # functions are not what that line calls. A vendored
          # `requests/__init__.py` that does declare `get` is a file and
          # still answers for `requests.get(...)`, and a package with no
          # `__init__.py` whose own files declare the callee still counts.
          rm -rf /tmp/markdir
          mkdir -p /tmp/markdir/log/tests/fixtures/logging /tmp/markdir/vend/vendor/requests /tmp/markdir/pkg/mypkg
          printf 'def info(x):\n    return x\n' > /tmp/markdir/log/a.py
          printf 'def info(x):\n    return x\n' > /tmp/markdir/log/b.py
          printf 'HELPER = 1\n' > /tmp/markdir/log/tests/fixtures/logging/x.py
          printf 'import logging\n\n\ndef go(u):\n    return logging.info(u)\n' > /tmp/markdir/log/caller.py
          printf 'def get(url):\n    return url\n' > /tmp/markdir/vend/vendor/requests/__init__.py
          printf 'def get(url):\n    return url\n' > /tmp/markdir/vend/mine.py
          printf 'import requests\n\n\ndef fetch(u):\n    return requests.get(u)\n' > /tmp/markdir/vend/caller.py
          printf 'def helper(x):\n    return x\n' > /tmp/markdir/pkg/mypkg/impl.py
          printf 'def helper(x):\n    return x\n' > /tmp/markdir/pkg/elsewhere.py
          printf 'import mypkg\n\n\ndef go(u):\n    return mypkg.helper(u)\n' > /tmp/markdir/pkg/caller.py
          for d in log vend pkg; do
            where-are-we --repo "/tmp/markdir/$d" --out "/tmp/markdir/$d-out" \
              --product none --force --quiet --no-semantic
          done
          python - <<'EOF'
          import json
          def graph(name):
              return json.load(open(f"/tmp/markdir/{name}-out/framework_map.json"))["call_graph_files"]
          assert graph("log") == {}, graph("log")
          assert graph("vend") == {"caller.py:fetch": ["get (__init__.py)"]}, graph("vend")
          assert graph("pkg") == {"caller.py:go": ["helper (elsewhere.py|impl.py)?"]}, graph("pkg")
          print("directory evidence:", graph("log"), graph("vend"), graph("pkg"))
          EOF
          # A name exactly one file defines keeps a bare edge: the poly
          # fixture's `charge` is declared once, and its edge carries no mark.
          rm -rf /tmp/markpoly
          python -c "
          import sys
          sys.path.insert(0, 'tests/golden')
          import build_fixtures
          build_fixtures.build_all('/tmp/markpoly')
          "
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/markpoly/poly/out/framework_map.json"))
          assert m["call_graph_files"] == {"b.ts:payInvoice": ["charge (a.ts)"]}, \
              m["call_graph_files"]
          assert all(row["ambiguous"] == 0 for row in m["call_graph_stats"].values()), \
              m["call_graph_stats"]
          assert all(row["marked"] == 0 for row in m["call_graph_stats"].values()), \
              m["call_graph_stats"]
          print("poly: unique edges carry no mark")
          EOF

      - name: a re-export resolves to the file that declares the name
        run: |
          set -o pipefail
          # A facade is a file that carries a name it does not declare.
          # `facade.py` has no `def build`; it has `from impl import build`,
          # so `facade.build(...)` runs `impl.py`'s `build` and the edge says
          # so, even though `other.py` declares a `build` of its own.
          rm -rf /tmp/reex
          mkdir -p /tmp/reex/repo
          printf 'def build(x):\n    return x\n' > /tmp/reex/repo/impl.py
          printf 'def build(x):\n    return x\n' > /tmp/reex/repo/other.py
          printf 'from impl import build\n' > /tmp/reex/repo/facade.py
          printf 'import facade\n\n\ndef go(u):\n    return facade.build(u)\n' > /tmp/reex/repo/caller.py
          # A facade in front of a facade: two hops, and the answer is still
          # the file with the `def`.
          printf 'from facade import build\n' > /tmp/reex/repo/outer.py
          printf 'import outer\n\n\ndef go2(u):\n    return outer.build(u)\n' > /tmp/reex/repo/caller2.py
          # A pair of files that take the name from each other and neither
          # declares it. The walk ends at the file it has already visited and
          # the candidate list stands, which is what the map knows.
          printf 'from b import f\n' > /tmp/reex/repo/a.py
          printf 'from a import f\n' > /tmp/reex/repo/b.py
          printf 'def f(x):\n    return x\n' > /tmp/reex/repo/c.py
          printf 'def f(x):\n    return x\n' > /tmp/reex/repo/d.py
          printf 'import a\n\n\ndef spin(u):\n    return a.f(u)\n' > /tmp/reex/repo/caller3.py
          where-are-we --repo /tmp/reex/repo --out /tmp/reex/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/reex/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert graph["caller.py:go"] == ["build (impl.py)"], graph
          assert graph["caller2.py:go2"] == ["build (impl.py)"], graph
          assert graph["caller3.py:spin"] == ["f (c.py|d.py)?"], graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 2 and stats["marked"] == 1, stats
          print("re-export:", graph, stats)
          EOF
          # A package is no different: `pkg/mod.py` is a file, and a file that
          # re-exports resolves whether it is reached as `pkg.mod` or as a
          # module beside the caller.
          rm -rf /tmp/reexpkg
          mkdir -p /tmp/reexpkg/repo/pkg
          printf 'def build(x):\n    return x\n' > /tmp/reexpkg/repo/deep.py
          printf 'def build(x):\n    return x\n' > /tmp/reexpkg/repo/other.py
          : > /tmp/reexpkg/repo/pkg/__init__.py
          printf 'from deep import build\n' > /tmp/reexpkg/repo/pkg/mod.py
          printf 'from pkg import mod\n\n\ndef go(u):\n    return mod.build(u)\n' > /tmp/reexpkg/repo/caller.py
          where-are-we --repo /tmp/reexpkg/repo --out /tmp/reexpkg/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/reexpkg/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert graph == {"caller.py:go": ["build (deep.py)"]}, graph
          assert m["call_graph_stats"]["python"]["marked"] == 0, m["call_graph_stats"]
          print("re-export through a package:", graph)
          EOF
          # And this repository's own facade. `mapper.py` re-exports `build`
          # from `_mapper/build.py` and `digest` from `_mapper/render.py`, so
          # the hook that builds a map names the two files that do the work.
          rm -rf /tmp/reexself
          where-are-we --repo . --out /tmp/reexself \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          graph = json.load(open("/tmp/reexself/framework_map.json"))["call_graph_files"]
          edges = graph["hooks.py:_ensure_map"]
          assert "build (build.py)" in edges, edges
          assert "digest (render.py)" in edges, edges
          print("this repository:", edges)
          EOF
          where-are-we --out /tmp/reexself --callers build > /tmp/reexself-callers.txt
          grep -qx "hooks.py:_ensure_map" /tmp/reexself-callers.txt
          # The walk is three steps, and the fixture says where the cap
          # falls: `g3 -> g2 -> g1 -> okimpl` resolves, `h1 -> h2 -> h3 -> h4
          # -> deepimpl` is one step too far and the candidate list stands.
          # `from impl import build as build` is the redundant rename a typed
          # package writes to mean a deliberate re-export, and it is followed;
          # `from impl import build as made` is a real rename and is not.
          rm -rf /tmp/reexhops
          mkdir -p /tmp/reexhops/repo
          printf 'def pow3(x):\n    return x\n' > /tmp/reexhops/repo/okimpl.py
          printf 'def pow3(x):\n    return x\n' > /tmp/reexhops/repo/otherpow.py
          printf 'from okimpl import pow3\n' > /tmp/reexhops/repo/g1.py
          printf 'from g1 import pow3\n' > /tmp/reexhops/repo/g2.py
          printf 'from g2 import pow3\n' > /tmp/reexhops/repo/g3.py
          printf 'import g3\n\n\ndef three(u):\n    return g3.pow3(u)\n' > /tmp/reexhops/repo/callerthree.py
          printf 'def zap(x):\n    return x\n' > /tmp/reexhops/repo/deepimpl.py
          printf 'def zap(x):\n    return x\n' > /tmp/reexhops/repo/otherzap.py
          printf 'from deepimpl import zap\n' > /tmp/reexhops/repo/h4.py
          printf 'from h4 import zap\n' > /tmp/reexhops/repo/h3.py
          printf 'from h3 import zap\n' > /tmp/reexhops/repo/h2.py
          printf 'from h2 import zap\n' > /tmp/reexhops/repo/h1.py
          printf 'import h1\n\n\ndef deep(u):\n    return h1.zap(u)\n' > /tmp/reexhops/repo/callerdeep.py
          printf 'def build(x):\n    return x\n' > /tmp/reexhops/repo/impl.py
          printf 'def build(x):\n    return x\n' > /tmp/reexhops/repo/otherbuild.py
          printf 'from impl import build as build\n' > /tmp/reexhops/repo/facade.py
          printf 'import facade\n\n\ndef go(u):\n    return facade.build(u)\n' > /tmp/reexhops/repo/caller.py
          printf 'from impl import build as made\n' > /tmp/reexhops/repo/renamer.py
          printf 'import renamer\n\n\ndef go2(u):\n    return renamer.made(u)\n' > /tmp/reexhops/repo/caller2.py
          where-are-we --repo /tmp/reexhops/repo --out /tmp/reexhops/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          graph = json.load(open("/tmp/reexhops/out/framework_map.json"))["call_graph_files"]
          assert graph["callerthree.py:three"] == ["pow3 (okimpl.py)"], graph
          assert graph["callerdeep.py:deep"] == ["zap (deepimpl.py|otherzap.py)?"], graph
          assert graph["caller.py:go"] == ["build (impl.py)"], graph
          assert "caller2.py:go2" not in graph, graph
          print("hops and renames:", graph)
          EOF

      - name: a receiver the function itself built is not a first-party call
        run: |
          set -o pipefail
          # `out = set()` and then `out.add(1)` is `set.add`, whatever this
          # tree declares by that name, so there is no edge and nothing to
          # mark. `out = make()` says nothing about what `out` holds, so that
          # edge stands with its candidate list.
          rm -rf /tmp/rcv
          mkdir -p /tmp/rcv/repo
          printf 'def add(x):\n    return x\n' > /tmp/rcv/repo/a.py
          printf 'def add(x):\n    return x\n' > /tmp/rcv/repo/b.py
          printf 'def make():\n    return []\n\n\ndef g():\n    out = set()\n    out.add(1)\n    return out\n' > /tmp/rcv/repo/built.py
          printf 'from built import make\n\n\ndef h():\n    out = make()\n    out.add(1)\n    return out\n' > /tmp/rcv/repo/opaque.py
          # The two container factories, under both spellings of the import.
          printf 'from collections import Counter\nimport collections\n\n\ndef tally(rows):\n    seen = Counter()\n    seen.add(1)\n    box = collections.defaultdict(list)\n    box.add(2)\n    return seen, box\n' > /tmp/rcv/repo/tally.py
          # A name a nested function never binds is the one written around it.
          printf 'def nested():\n    seen = set()\n\n    def inner(word):\n        seen.add(word)\n\n    inner("x")\n    return seen\n' > /tmp/rcv/repo/closure.py
          where-are-we --repo /tmp/rcv/repo --out /tmp/rcv/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/rcv/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert graph == {"opaque.py:h": ["add (a.py|b.py)?",
                                           "make (built.py)"]}, graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 1 and stats["marked"] == 1, stats
          print("built receivers:", graph, stats)
          EOF
          # `self.add(...)` in a class that declares `add` is a call inside
          # the file. `self.add(...)` in a class whose one base lives in
          # another file is a call to that file. A base this tree never
          # declares settles nothing, and the candidate list stands.
          rm -rf /tmp/selfcls
          mkdir -p /tmp/selfcls/repo
          printf 'def add(x):\n    return x\n' > /tmp/selfcls/repo/a.py
          printf 'def add(x):\n    return x\n' > /tmp/selfcls/repo/b.py
          printf 'class C:\n    def add(self, x):\n        return x\n\n    def g(self):\n        return self.add(1)\n\n    @classmethod\n    def k(cls):\n        return cls.add(None, 2)\n' > /tmp/selfcls/repo/c.py
          printf 'class Base:\n    def add(self, x):\n        return x\n' > /tmp/selfcls/repo/base.py
          printf 'from base import Base\n\n\nclass D(Base):\n    def go(self):\n        return self.add(1)\n' > /tmp/selfcls/repo/d.py
          printf 'class Mystery(Whatever):\n    def run(self):\n        return self.add(1)\n' > /tmp/selfcls/repo/e.py
          where-are-we --repo /tmp/selfcls/repo --out /tmp/selfcls/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/selfcls/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert "c.py:g" not in graph and "c.py:k" not in graph, graph
          assert graph["d.py:go"] == ["add (base.py)"], graph
          assert graph["e.py:run"] == ["add (a.py|b.py|base.py|c.py)?"], graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 1 and stats["marked"] == 1, stats
          print("self and cls:", graph, stats)
          EOF
          # And the three rules together on this repository: every surviving
          # mark is a call on a receiver that is not a plain name, so there is
          # nothing left for a rule of this kind to settle.
          rm -rf /tmp/rcvself
          where-are-we --repo . --out /tmp/rcvself \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/rcvself/framework_map.json"))
          graph = m["call_graph_files"]
          marked = [(k, e) for k, v in sorted(graph.items()) for e in v
                    if e.endswith("?")]
          assert len(graph) == 60, len(graph)
          assert len(marked) <= 1, marked
          assert all(e.startswith("add ") for _k, e in marked), marked
          print("this repository:", len(graph), "keys", len(marked), "marked",
                marked)
          EOF
          # What the rule does not claim. A parameter defaulting to `None`
          # says nothing about what a caller passes, so that edge stands. A
          # `setdefault` whose second argument is a builtin says what comes
          # back, so `d.setdefault(k, set()).add(v)` is `set.add`; `d[k]` says
          # nothing and keeps its mark. Two functions of one name in a file
          # share a graph key, and the second one's receiver is its own: the
          # first one's `out = set()` does not settle it.
          rm -rf /tmp/rcvedge
          mkdir -p /tmp/rcvedge/repo
          printf 'def add(x):\n    return x\n' > /tmp/rcvedge/repo/a.py
          printf 'def add(x):\n    return x\n' > /tmp/rcvedge/repo/b.py
          printf 'def f(store=None, count=0, label=""):\n    store.add(1)\n    return count, label\n' > /tmp/rcvedge/repo/nonedef.py
          printf 'def sd(d, k, v):\n    d.setdefault(k, set()).add(v)\n    return d\n' > /tmp/rcvedge/repo/sd.py
          printf 'def sub(d, k, v):\n    d[k].add(v)\n    return d\n' > /tmp/rcvedge/repo/sub.py
          printf 'out = None\n\n\ndef f():\n    out = set()\n    out.add(1)\n    return out\n\n\ndef f():\n    out.add(2)\n    return out\n' > /tmp/rcvedge/repo/dup.py
          where-are-we --repo /tmp/rcvedge/repo --out /tmp/rcvedge/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/rcvedge/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert graph["nonedef.py:f"] == ["add (a.py|b.py)?"], graph
          assert graph["sub.py:sub"] == ["add (a.py|b.py)?"], graph
          assert graph["dup.py:f"] == ["add (a.py|b.py)?"], graph
          assert "sd.py:sd" not in graph, graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 0 and stats["marked"] == 3, stats
          print("what the rule does not claim:", graph, stats)
          EOF
          # A base class is followed only where the file says where it comes
          # from. `class D(other.Base)` where `other.py` has no `Base`, and
          # `class E(Base)` with no import at all, both keep the candidate
          # list; the three spellings that do carry evidence resolve, the last
          # of them through a facade that re-exports the class.
          rm -rf /tmp/attrbase
          mkdir -p /tmp/attrbase/repo
          printf 'def add(x):\n    return x\n' > /tmp/attrbase/repo/a.py
          printf 'class Base:\n    def add(self, x):\n        return x\n' > /tmp/attrbase/repo/base.py
          printf 'class Other:\n    pass\n' > /tmp/attrbase/repo/other.py
          printf 'import other\n\n\nclass D(other.Base):\n    def go(self):\n        return self.add(1)\n' > /tmp/attrbase/repo/d.py
          printf 'class E(Base):\n    def run(self):\n        return self.add(1)\n' > /tmp/attrbase/repo/e.py
          printf 'from base import Base\n\n\nclass G(Base):\n    def go2(self):\n        return self.add(1)\n' > /tmp/attrbase/repo/g.py
          printf 'import base\n\n\nclass H(base.Base):\n    def go3(self):\n        return self.add(1)\n' > /tmp/attrbase/repo/h.py
          printf 'from base import Base\n' > /tmp/attrbase/repo/facade.py
          printf 'from facade import Base\n\n\nclass K(Base):\n    def go4(self):\n        return self.add(1)\n' > /tmp/attrbase/repo/k.py
          where-are-we --repo /tmp/attrbase/repo --out /tmp/attrbase/out \
            --product none --force --quiet --no-semantic
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/attrbase/out/framework_map.json"))
          graph = m["call_graph_files"]
          assert graph["d.py:go"] == ["add (a.py|base.py)?"], graph
          assert graph["e.py:run"] == ["add (a.py|base.py)?"], graph
          assert graph["g.py:go2"] == ["add (base.py)"], graph
          assert graph["h.py:go3"] == ["add (base.py)"], graph
          assert graph["k.py:go4"] == ["add (base.py)"], graph
          stats = m["call_graph_stats"]["python"]
          assert stats["edges"] == 3 and stats["marked"] == 2, stats
          print("a base is followed on evidence:", graph, stats)
          EOF

      - name: "wawe-eval --graph: the map says how much of its call tree it resolved"
        run: |
          set -o pipefail
          # This step builds the fixtures it reads, so what it asserts does
          # not depend on which steps ran before it.
          rm -rf /tmp/graphfix
          python -c "
          import sys
          sys.path.insert(0, 'tests/golden')
          import build_fixtures
          build_fixtures.build_all('/tmp/graphfix')
          "
          wawe-eval --map /tmp/graphfix/poly/out --graph > /tmp/graphfix/graph.txt
          cat /tmp/graphfix/graph.txt
          grep -q "resolution_rate" /tmp/graphfix/graph.txt
          grep -q "edges" /tmp/graphfix/graph.txt
          # Without the precise extra the tree-sitter half says so rather than
          # printing a zero.
          grep -q "regex vs tree-sitter: not compared" /tmp/graphfix/graph.txt
          wawe-eval --map /tmp/graphfix/poly/out --graph --json > /tmp/graphfix/graph.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/graphfix/graph.json"))
          assert report["has_call_graph_stats"], report
          langs = {row["language"]: row for row in report["languages"]}
          assert set(langs) == {"ts_js", "go"}, sorted(langs)
          for name, row in sorted(langs.items()):
              for key in ("resolution_rate", "ambiguous_share"):
                  v = row[key]
                  assert isinstance(v, float) and 0.0 <= v <= 1.0, (name, key, row)
              # Every callee name the walk looked at in the poly fixture is
              # declared in it, and none of them is declared twice.
              assert row["resolved"] == row["sites"] > 0, row
              assert row["ambiguous"] == 0 and row["marked"] == 0, row
              assert row["resolution_rate"] == 1.0, row
          # A rate is a property of the tree that was read; `edges` is the
          # graph that was written, and the fixture's one cross-file call is
          # in it. A map with no edges at all cannot pass this line.
          assert langs["ts_js"]["edges"] == 1, langs["ts_js"]
          assert sum(row["edges"] for row in langs.values()) > 0, langs
          print("poly: resolved == sites in", sorted(langs),
                "edges", {k: v["edges"] for k, v in sorted(langs.items())})
          EOF
          # The key is in every map the build writes, including one with no
          # call graph at all, so SCHEMA.md documents something always emitted.
          python - <<'EOF'
          import json
          for fixture in ("suite", "code", "poly"):
              m = json.load(open(f"/tmp/graphfix/{fixture}/out/framework_map.json"))
              stats = m["call_graph_stats"]
              assert isinstance(stats, dict), (fixture, stats)
              edges = sum(len(v) for v in m["call_graph_files"].values())
              written = 0
              for lang, row in sorted(stats.items()):
                  assert row["sites"] >= row["resolved"] >= 0, (fixture, lang, row)
                  assert row["sites"] >= row["ambiguous"] >= 0, (fixture, lang, row)
                  assert row["marked"] >= 0 and row["edges"] >= 0, (fixture, lang, row)
                  written += row["edges"] + row["marked"]
              # The counters are taken before the 60-key cap, so they count
              # every edge the graph holds and may count more.
              assert written >= edges, (fixture, written, edges)
              print(fixture, stats)
          EOF

      - name: every flag the parser knows is in the effects table, and nothing else is
        run: |
          set -o pipefail
          # A guard classifies this tool by its flags. A flag the parser
          # grows and the table does not is a write nobody was told about.
          python - <<'EOF'
          import sys
          from where_are_we import effects
          from where_are_we.cli import build_parser
          known = set(effects.option_strings(build_parser()))
          table = set(effects.EFFECTS)
          missing, extra = sorted(known - table), sorted(table - known)
          unclassed = sorted(f for f, c in effects.EFFECTS.items()
                             if c not in effects.ORDER)
          print(f"{len(known)} flags on the parser, {len(table)} in the table, "
                f"not in the table: {missing}, not on the parser: {extra}, "
                f"with a class the order does not know: {unclassed}")
          sys.exit(1 if (missing or extra or unclassed) else 0)
          EOF
          # The file in the wheel is the table, byte for byte. Regenerate
          # it with the same command when the table moves:
          #   where-are-we --effects --json > src/where_are_we/effects.json
          where-are-we --effects --json > /tmp/effects.json
          diff -u src/where_are_we/effects.json /tmp/effects.json
          # And it is installed beside the code, not merely in the checkout.
          python - <<'EOF'
          import importlib.resources as res, json
          data = json.loads(res.files("where_are_we").joinpath("effects.json")
                            .read_text(encoding="utf-8"))
          assert data["schema"] == "where-are-we-effects/1", data["schema"]
          assert data["order"] == ["read", "writes-map-dir", "writes-repo",
                                   "writes-config", "network"], data["order"]
          print("effects.json ships with the package:", len(data["flags"]), "flags")
          EOF

      - name: a command line says what it would write before it runs
        run: |
          set -o pipefail
          rm -rf /tmp/eff
          mkdir -p /tmp/eff
          where-are-we --effects -- where-are-we --out /tmp/eff/m --ask x > /tmp/eff/a
          where-are-we --effects -- where-are-we --install-hook git > /tmp/eff/b
          where-are-we --effects -- where-are-we --mcp > /tmp/eff/c
          where-are-we --effects -- where-are-we --repo . > /tmp/eff/d
          cat /tmp/eff/a /tmp/eff/b /tmp/eff/c /tmp/eff/d
          grep -qx writes-map-dir /tmp/eff/a
          grep -qx "\-\-out writes-map-dir" /tmp/eff/a
          grep -qx "\-\-ask read" /tmp/eff/a
          grep -qx writes-config /tmp/eff/b
          grep -qx read /tmp/eff/c
          # Nothing on that last line says "write", and it still writes: with
          # no flag that answers from an existing map, the run builds one.
          grep -qx writes-map-dir /tmp/eff/d
          grep -qx "build writes-map-dir" /tmp/eff/d
          # Classifying runs nothing, so the directory in the command line
          # that was classified does not exist afterwards.
          if test -e /tmp/eff/m; then
            echo "--effects built something"; exit 1
          fi
          where-are-we --effects > /tmp/eff/table
          head -2 /tmp/eff/table
          grep -q "^--install-hook  *writes-config$" /tmp/eff/table
          grep -qx "where-are-we-effects/1" /tmp/eff/table
          where-are-we --effects --json > /tmp/eff/table.json
          grep -q '"schema": "where-are-we-effects/1"' /tmp/eff/table.json

      - name: --dry-run names every path it would write and writes none of them
        run: |
          set -o pipefail
          rm -rf /tmp/dry /tmp/dryout
          mkdir -p /tmp/dry/repo /tmp/dry/home /tmp/dryout
          export HOME=/tmp/dry/home
          printf 'def f():\n    pass\n' > /tmp/dry/repo/a.py
          git -C /tmp/dry/repo init -q
          find /tmp/dry -type f | sort > /tmp/dryout/files.before
          xargs sha256sum < /tmp/dryout/files.before | sha256sum > /tmp/dryout/hash.before
          where-are-we --repo /tmp/dry/repo --init --dry-run > /tmp/dryout/init.txt
          where-are-we --repo /tmp/dry/repo --out /tmp/dry/repo/.wawe \
            --agent-file /tmp/dry/repo/AGENTS.md --dry-run > /tmp/dryout/agent.txt
          where-are-we --repo /tmp/dry/repo --install-hook git --dry-run \
            > /tmp/dryout/git.txt
          where-are-we --repo /tmp/dry/repo --install-hook claude --dry-run \
            > /tmp/dryout/claude.txt
          cat /tmp/dryout/*.txt
          grep -qx "would write /tmp/dry/repo/.framework-map.json" /tmp/dryout/init.txt
          grep -qx "would write /tmp/dry/repo/AGENTS.md" /tmp/dryout/agent.txt
          grep -qx "would write /tmp/dry/repo/.wawe/framework_map.md" /tmp/dryout/agent.txt
          for hook in post-checkout post-merge post-commit; do
            grep -qx "would write /tmp/dry/repo/.git/hooks/$hook" /tmp/dryout/git.txt
          done
          grep -qx "would write /tmp/dry/home/.claude/settings.json" /tmp/dryout/claude.txt
          # The tree is the tree it was: same files, same contents.
          find /tmp/dry -type f | sort > /tmp/dryout/files.after
          xargs sha256sum < /tmp/dryout/files.after | sha256sum > /tmp/dryout/hash.after
          diff /tmp/dryout/files.before /tmp/dryout/files.after
          diff /tmp/dryout/hash.before /tmp/dryout/hash.after
          # And a preview is not a fiction: the same commands, run for real,
          # create every path it named.
          where-are-we --repo /tmp/dry/repo --install-hook git
          where-are-we --repo /tmp/dry/repo --install-hook claude
          where-are-we --repo /tmp/dry/repo --init
          where-are-we --repo /tmp/dry/repo --out /tmp/dry/repo/.wawe \
            --agent-file /tmp/dry/repo/AGENTS.md --quiet --no-semantic
          sed 's/^would write //;s/^would replace //' /tmp/dryout/*.txt \
            | sort -u > /tmp/dryout/promised
          while read -r path; do
            if test ! -e "$path"; then
              echo "the dry run named $path and the real run did not write it"
              exit 1
            fi
          done < /tmp/dryout/promised
          wc -l < /tmp/dryout/promised
