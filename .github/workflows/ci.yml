            echo "unexpected match: grep -q 'BEGIN RSA PRIVATE KEY' /tmp/sec/m/framework_map.json"; exit 1
          fi
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"find","arguments":{"phrase":"MIIEowIBAAKCAQEA"}}}' \
            | where-are-we --repo /tmp/sec/r --out /tmp/sec/m --mcp > /tmp/sec/pem.txt
