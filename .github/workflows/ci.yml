name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install . pytest
      - name: tests
        run: pytest tests -q
      - name: golden
        run: python tests/golden/check.py

      - name: ask expands synonyms and stems
        run: |
          mkdir -p /tmp/syn
          printf '%s\n' \
            '# map' \
            '' \
            '## Steps' \
            '- `steps/a.py:3` user signs in with signin()' \
            '- `steps/b.py:9` cart total' \
            > /tmp/syn/framework_map.md
          where-are-we --out /tmp/syn --ask login | tee /tmp/syn-out.txt
          grep -q "signin()" /tmp/syn-out.txt
          if grep -q "cart total" /tmp/syn-out.txt; then
            echo "unexpected match: grep -q 'cart total' /tmp/syn-out.txt"; exit 1
          fi
          grep -q "also matched: signin" /tmp/syn-out.txt

      - name: .wawe.toml [synonyms] merges into ask, tomllib
        run: |
          mkdir -p /tmp/syncfg/repo /tmp/syncfg/out
          printf '%s\n' \
            '[synonyms]' \
            'invoice = ["proforma", "receipt"]' \
            > /tmp/syncfg/repo/.wawe.toml
          printf '%s\n' \
            '# map' \
            '' \
            '## Billing' \
            '- `app/billing.py:5` handles the proforma export for a customer' \
            > /tmp/syncfg/out/framework_map.md
          where-are-we --repo /tmp/syncfg/repo --out /tmp/syncfg/out --ask invoice | tee /tmp/syncfg-out.txt
          grep -q "also matched:.*proforma" /tmp/syncfg-out.txt
          # The way a hook or the plugin starts the server: no --repo, the map
          # under <repo>/.wawe. The repository is the parent of that directory
          # and its [synonyms] must still reach the answer.
          rm -rf /tmp/syncfg/repo/.wawe && cp -R /tmp/syncfg/out /tmp/syncfg/repo/.wawe
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"ask","arguments":{"words":"invoice"}}}' \
            | (cd / && where-are-we --out /tmp/syncfg/repo/.wawe --mcp) | tee /tmp/syncfg-mcp.txt
          grep -q "also matched:.*proforma" /tmp/syncfg-mcp.txt

      - name: the facade after the split
        run: |
          set -o pipefail
          rm -rf /tmp/fac /tmp/facmap /tmp/flat
          mkdir -p /tmp/fac
          printf 'def charge(x):\n    return x\n' > /tmp/fac/billing.py
          # Both ways of running it, and the entry point in between.
          python -m where_are_we.mapper --repo /tmp/fac --out /tmp/facmap --quiet
          test -s /tmp/facmap/framework_map_brief.md
          python src/where_are_we/mapper.py --repo /tmp/fac --out /tmp/facmap --force --quiet
          where-are-we --repo /tmp/fac --out /tmp/facmap --force --quiet
          # Every name the tests, mcp.py, hooks.py, lsp.py and the plugin reach
          # for through `mapper.` still resolves through the facade.
          python - <<'EOF'
          from where_are_we import mapper
          for name in ("build brief digest for_audience init_manifest install_hook main pointer "
                       "ask find_text index_lines index_declarations meaning_tail propose_docs "
                       "changed_since declarations_in POINTER_MAX PARSE_COUNT _cap_sections "
                       "_definitions_for _load_parse_cache _save_parse_cache _config _fingerprint "
                       "_walk _slurp _cached redact DEFINITIONS INDEXED LINES TRUNCATED "
                       "_WALK_CACHE _IGNORE_CACHE _FILE_CACHE _PARSE_CACHE CACHE_SCHEMA").split():
              assert hasattr(mapper, name), name
          EOF
          # Assigning the shared state through the facade reaches the module the
          # package counts into, which is what tests/golden/check.py depends on.
          python - <<'EOF'
          from where_are_we import mapper
          from where_are_we._mapper import state
          mapper.PARSE_COUNT = 0
          assert state.PARSE_COUNT == 0
          mapper.build("/tmp/fac")
          assert mapper.PARSE_COUNT == state.PARSE_COUNT > 0, mapper.PARSE_COUNT
          assert mapper.DEFINITIONS is state.DEFINITIONS
          EOF
          # Every code path the split touched, including the two the golden
          # suite does not reach. `--pointer` and `--docs` are how the map is
          # actually read and how it offers a repository its documentation, and
          # both live in modules that gained a package level.
          where-are-we --out /tmp/facmap --pointer | grep -q "framework map"
          where-are-we --out /tmp/facmap --sections | grep -q "Where things are"
          docs_out=$(where-are-we --repo /tmp/fac --out /tmp/facmap --docs)
          test -n "$docs_out"
          # A name a moved function reads but its new module never imported is
          # a NameError nothing sees until that branch runs. symtable finds all
          # of them without running anything.
          python - <<'EOF'
          import builtins, pathlib, symtable, sys
          bad = []
          for path in sorted(pathlib.Path("src/where_are_we").rglob("*.py")):
              text = path.read_text()
              table = symtable.symtable(text, str(path), "exec")
              top = {s.get_name() for s in table.get_symbols() if s.is_assigned()
                     or s.is_imported()}
              def check(t, where):
                  for sym in t.get_symbols():
                      name = sym.get_name()
                      if (sym.is_global() and not sym.is_assigned()
                              and name not in top and not hasattr(builtins, name)):
                          bad.append(f"{path}: {where}: {name}")
                  for child in t.get_children():
                      check(child, where + "." + child.get_name())
              check(table, str(path))
          print("\n".join(bad) or "no undefined module-level names")
          sys.exit(1 if bad else 0)
          EOF
          # The deb and the rpm copy the tree by hand: a flat copy of *.py would
          # ship the facade with nothing behind it.
          mkdir -p /tmp/flat/where_are_we
          cp -R src/where_are_we/. /tmp/flat/where_are_we/
          python -c 'import sys; sys.path.insert(0, "/tmp/flat"); from where_are_we.mapper import main; sys.argv = ["where-are-we", "--repo", "/tmp/fac", "--out", "/tmp/facmap", "--force", "--quiet"]; sys.exit(main())'
      - name: map itself
        run: |
          rm -rf /tmp/map
          where-are-we --repo . --out /tmp/map && test -s /tmp/map/framework_map_brief.md
      - name: map a polyglot fixture
        run: |
          rm -rf /tmp/fx /tmp/fxmap
          mkdir -p /tmp/fx/steps /tmp/fx/migrations
          printf 'from behave import step\n@step("a user exists")\ndef f(c):\n    pass\n' > /tmp/fx/steps/a.py
          printf 'Given("a logged in user", async function () {});\n' > /tmp/fx/steps.ts
          printf 'func TestFoo(t *testing.T) {}\n' > /tmp/fx/main_test.go
          printf 'CREATE TABLE users (id int, email text);\n' > /tmp/fx/migrations/V1__init.sql
          where-are-we --repo /tmp/fx --out /tmp/fxmap
          grep -q "cucumber-js" /tmp/fxmap/framework_map_brief.md
          grep -q "users" /tmp/fxmap/framework_map_brief.md
      - name: cross-file call graph (ts/js, go)
        run: |
          rm -rf /tmp/cg /tmp/cgmap
          mkdir -p /tmp/cg
          printf 'export function charge(x) { return x }\n' > /tmp/cg/a.ts
          printf 'import { charge } from "./a"\nexport async function pay() {\n  const r = charge(1)\n  return r\n}\nfunction local() { return pay() }\n' > /tmp/cg/b.ts
          printf 'package m\nfunc Serve() {}\n' > /tmp/cg/s.go
          printf 'package m\nfunc Run() { Serve() }\n' > /tmp/cg/c.go
          where-are-we --repo /tmp/cg --out /tmp/cgmap
          grep -q "charge (a.ts)" /tmp/cgmap/framework_map_brief.md
          grep -q "Serve (s.go)" /tmp/cgmap/framework_map_brief.md
          if grep -q "b.ts:local" /tmp/cgmap/framework_map_brief.md; then
            echo "unexpected match: grep -q 'b.ts:local' /tmp/cgmap/framework_map_brief.md"; exit 1
          fi
      - name: map a rust/kotlin/csharp/ruby fixture
        run: |
          rm -rf /tmp/langs /tmp/langsmap
          mkdir -p /tmp/langs
          printf 'pub fn charge() {}\nstruct Invoice;\npub(crate) enum State { A }\ntrait Pay {}\n// fn commented() {}\n' > /tmp/langs/lib.rs
          printf 'class Invoice(val id: Int)\nfun charge(): Unit = Unit\nobject Config\nsuspend fun refund() {}\n' > /tmp/langs/Pay.kt
          printf 'public class Invoice {\n  public static void Charge() {}\n  private int Total() => 1;\n}\npublic interface IPay {}\n' > /tmp/langs/Pay.cs
          printf 'module Billing\n  class Invoice\n    def charge?\n    end\n    def self.refund\n    end\n  end\nend\n' > /tmp/langs/pay.rb
          where-are-we --repo /tmp/langs --out /tmp/langsmap
          # Exact "Defined here" rows, name and file:line together, so a
          # dropped construct (a missed `trait Pay`, a `fun charge` that
          # stops matching) fails here instead of passing on a coincidental
          # substring hit elsewhere in the map.
          grep -qF '`Pay` — /tmp/langs/lib.rs:4' /tmp/langsmap/framework_map*.md
          grep -qF '`State` — /tmp/langs/lib.rs:3' /tmp/langsmap/framework_map*.md
          grep -qF '`Invoice` — /tmp/langs/Pay.cs:1' /tmp/langsmap/framework_map*.md
          grep -qF '`Charge` — /tmp/langs/Pay.cs:2' /tmp/langsmap/framework_map*.md
          grep -qF '`Total` — /tmp/langs/Pay.cs:3' /tmp/langsmap/framework_map*.md
          grep -qF '`IPay` — /tmp/langs/Pay.cs:5' /tmp/langsmap/framework_map*.md
          grep -qF '`charge` — /tmp/langs/Pay.kt:2' /tmp/langsmap/framework_map*.md
          grep -qF '`Config` — /tmp/langs/Pay.kt:3' /tmp/langsmap/framework_map*.md
          grep -qF '`refund` — /tmp/langs/Pay.kt:4' /tmp/langsmap/framework_map*.md
          grep -qF '`Billing` — /tmp/langs/pay.rb:1' /tmp/langsmap/framework_map*.md
          grep -qF '`charge?` — /tmp/langs/pay.rb:3' /tmp/langsmap/framework_map*.md
          if grep -q "commented" /tmp/langsmap/framework_map*.md; then
            echo "unexpected match: grep -q 'commented' /tmp/langsmap/framework_map*.md"; exit 1
          fi
      - name: who calls X
        run: |
          mkdir -p /tmp/wc
          printf 'def f():\n    return 1\n' > /tmp/wc/x.py
          printf 'from x import f\n\ndef g():\n    return f()\n' > /tmp/wc/y.py
          where-are-we --repo /tmp/wc --out /tmp/wcmap
          where-are-we --out /tmp/wcmap --callers f | grep -qx "y.py:g"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"callers","arguments":{"name":"f"}}}' \
            | where-are-we --out /tmp/wcmap --mcp \
            | grep -q "f: y.py:g"
      - name: callees and impact walk the graph the map holds
        run: |
          set -o pipefail
          rm -rf /tmp/imp /tmp/impmap /tmp/impcap /tmp/impcg /tmp/impcgmap
          mkdir -p /tmp/imp
          # a -> b -> c -> d, and d -> b closes a cycle. The walk back from
          # `d` must reach c, b, a one hop at a time and stop, not loop.
          printf 'from b import b\n\ndef a():\n    return b()\n' > /tmp/imp/a.py
          printf 'from c import c\n\ndef b():\n    return c()\n' > /tmp/imp/b.py
          printf 'from d import d\n\ndef c():\n    return d()\n' > /tmp/imp/c.py
          printf 'from b import b\n\ndef d():\n    return b()\n' > /tmp/imp/d.py
          where-are-we --repo /tmp/imp --out /tmp/impmap --quiet
          where-are-we --out /tmp/impmap --callees b | grep -qx "b: c (c.py)"
          where-are-we --out /tmp/impmap --impact d --impact-depth 1 \
            | grep -qx "depth 1: c.py:c"
          where-are-we --out /tmp/impmap --impact d --impact-depth 3 > /tmp/imp/d3.txt
          grep -qx "depth 1: c.py:c" /tmp/imp/d3.txt
          grep -qx "depth 2: b.py:b" /tmp/imp/d3.txt
          grep -qx "depth 3: a.py:a" /tmp/imp/d3.txt
          # Depth 6 on the same cycle returns the same three hops: the visited
          # set is what stops it, not the depth running out.
          where-are-we --out /tmp/impmap --impact d --impact-depth 6 \
            | sed 's/to depth 6/to depth 3/' > /tmp/imp/d6.txt
          diff /tmp/imp/d3.txt /tmp/imp/d6.txt
          # A name nobody calls.
          where-are-we --out /tmp/impmap --impact nosuchname \
            | grep -qx "nothing in the map calls nosuchname"
          # Its own polyglot fixture, not the one an earlier step left in
          # /tmp: a step that reads another step's leftovers passes or fails
          # for reasons that are not in it.
          mkdir -p /tmp/impcg
          printf 'export function charge(x) { return x }\n' > /tmp/impcg/a.ts
          printf 'import { charge } from "./a"\nexport async function pay() {\n  const r = charge(1)\n  return r\n}\n' > /tmp/impcg/b.ts
          printf 'package m\nfunc Serve() {}\n' > /tmp/impcg/s.go
          printf 'package m\nfunc Run() { Serve() }\n' > /tmp/impcg/c.go
          where-are-we --repo /tmp/impcg --out /tmp/impcgmap --quiet
          where-are-we --out /tmp/impcgmap --callees pay | grep -qx "pay: charge (a.ts)"
          where-are-we --out /tmp/impcgmap --callees Run | grep -qx "Run: Serve (s.go)"
          where-are-we --out /tmp/impcgmap --callees charge \
            | grep -qx "charge calls nothing in the map"
          # A behave step function is in both graphs, and the same callee
          # must not come back twice, once bare and once with its file.
          rm -rf /tmp/impsuite
          cp -r tests/golden/maps/suite /tmp/impsuite
          where-are-we --out /tmp/impsuite --callees step_pay_1 \
            | grep -qx "step_pay_1: click_1 (checkout.py)"
          # Two files defining one name: the walk follows both and says so,
          # and the note appears only once the ambiguous name has actually
          # put a row in the answer (depth 1 expands `leaf`, not `shared`).
          rm -rf /tmp/dup /tmp/dupmap
          mkdir -p /tmp/dup
          printf 'def leaf():\n    return 1\n' > /tmp/dup/helper.py
          printf 'from helper import leaf\n\ndef shared():\n    return leaf()\n' > /tmp/dup/p.py
          printf 'from helper import leaf\n\ndef shared():\n    return leaf()\n' > /tmp/dup/q.py
          printf 'from p import shared\n\ndef top():\n    return shared()\n' > /tmp/dup/top.py
          where-are-we --repo /tmp/dup --out /tmp/dupmap --quiet
          where-are-we --out /tmp/dupmap --impact leaf --impact-depth 2 > /tmp/dup/out.txt
          grep -qx "depth 1: p.py:shared, q.py:shared" /tmp/dup/out.txt
          grep -qx "depth 2: top.py:top" /tmp/dup/out.txt
          grep -qF 'note: 2 files define `shared` (p.py:shared, q.py:shared)' /tmp/dup/out.txt
          if where-are-we --out /tmp/dupmap --impact leaf --impact-depth 1 | grep -q "^note:"; then
            echo "a note was printed about a name whose callers are not in the answer"; exit 1
          fi
          # The rule is in the first line of every reply, not only when the
          # keys happen to show a clash: q.py's `shared` calls nothing across
          # files, so it has no key, and tq.py:topq is unioned in with nothing
          # in the key data to notice it by.
          rm -rf /tmp/sil /tmp/silmap
          mkdir -p /tmp/sil
          printf 'def leaf():\n    return 1\n' > /tmp/sil/helper.py
          printf 'from helper import leaf\n\ndef shared():\n    return leaf()\n' > /tmp/sil/p.py
          printf 'def shared():\n    return 2\n' > /tmp/sil/q.py
          printf 'from p import shared\n\ndef topp():\n    return shared()\n' > /tmp/sil/tp.py
          printf 'from q import shared\n\ndef topq():\n    return shared()\n' > /tmp/sil/tq.py
          where-are-we --repo /tmp/sil --out /tmp/silmap --quiet
          where-are-we --out /tmp/silmap --impact leaf --impact-depth 2 > /tmp/sil/out.txt
          grep -qx "depth 2: tp.py:topp, tq.py:topq" /tmp/sil/out.txt
          for f in /tmp/sil/out.txt /tmp/dup/out.txt /tmp/imp/d3.txt; do
            head -1 "$f" | grep -q "hops are followed by name"
            head -1 "$f" | grep -q "only cross-file calls are in the graph"
            head -1 "$f" | grep -q "at most 60 cross-file call graph keys and 120 step ones"
          done
          # And those two numbers are the map's own, still.
          python - <<'EOF'
          from where_are_we import ask
          from where_are_we._mapper import build
          assert ask.MAP_CALL_GRAPH_KEYS == build.CALL_GRAPH_KEYS, "cross-file cap drifted"
          assert ask.MAP_STEP_GRAPH_KEYS == build.STEP_GRAPH_KEYS, "step cap drifted"
          print("caveat quotes the map's own caps:", build.CALL_GRAPH_KEYS, build.STEP_GRAPH_KEYS)
          EOF
          # The 200-entry cap, notes counted in it, on maps written by hand: a
          # real build caps its own call graph at 60 keys, so 250 callers and
          # a 300-way name only exist here.
          mkdir -p /tmp/impcap
          printf '# Map\n' > /tmp/impcap/framework_map.md
          python - <<'EOF'
          import json
          graph = {}
          for i in range(300):
              graph["s%03d.py:leaf" % i] = ["helper (h.py)"]
              graph["w%03d.py:wide" % i] = ["helper (h.py)"]
          for i in range(250):
              graph["c%03d.py:f%03d" % (i, i)] = ["leaf (s000.py)"]
          for i in range(3):
              graph["t%d.py:g%d" % (i, i)] = ["wide (w000.py)"]
          json.dump({"schema": "where-are-we/1", "call_graph_files": graph,
                     "call_graph": {}},
                    open("/tmp/impcap/framework_map.json", "w"))
          EOF
          # A note names five keys and then how many more, never three hundred.
          where-are-we --out /tmp/impcap --impact wide --impact-depth 1 > /tmp/impcap/wide.txt
          grep -qF 'note: 300 files define `wide` (w000.py:wide, w001.py:wide, w002.py:wide, w003.py:wide, w004.py:wide, … and 295 more); callers of any of them are counted.' /tmp/impcap/wide.txt
          where-are-we --out /tmp/impcap --impact leaf --impact-depth 1 > /tmp/impcap/out.txt
          grep -qx "… 50 more at depth 1, 1 note not shown. Ask again with a smaller depth." /tmp/impcap/out.txt
          python - <<'EOF'
          import re
          KEY = re.compile(r"[A-Za-z0-9_]+\.[A-Za-z0-9_]+:[A-Za-z0-9_]+")
          for path, want in (("/tmp/impcap/out.txt", 200), ("/tmp/impcap/wide.txt", 8)):
              body = open(path).read()
              entries = 0
              for line in body.splitlines():
                  if line.startswith("depth "):
                      entries += len(line.split(": ", 1)[1].split(", "))
                  elif line.startswith("note: "):
                      entries += len(KEY.findall(line.split("(", 1)[1]))
              assert entries == want, (path, entries, want)
              assert entries <= 200, (path, entries)
              print(f"{path}: {entries} entries, notes included, {len(body)} bytes")
          EOF
          # A depth outside 1..6 is refused by both front doors, not answered.
          for d in 0 7 -1; do
            if where-are-we --out /tmp/impmap --impact d --impact-depth "$d" > /tmp/imp/bad.out 2> /tmp/imp/bad.err; then
              echo "--impact-depth $d exited 0"; exit 1
            fi
            grep -q "must be from 1 to 6" /tmp/imp/bad.err
            test ! -s /tmp/imp/bad.out
          done
          printf '%s\n%s\n%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":0}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":7}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":-1}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":3.5}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":"abc"}}}' \
            | where-are-we --out /tmp/impmap --mcp > /tmp/imp/bad.jsonl
          python - <<'EOF'
          import json
          rows = [json.loads(l) for l in open("/tmp/imp/bad.jsonl")]
          assert len(rows) == 5, len(rows)
          for row in rows:
              assert "result" not in row, row
              assert row["error"]["code"] == -32602, row
              assert row["error"]["message"] == "depth must be an integer from 1 to 6", row
          print("MCP refuses depth 0, 7, -1, 3.5 and 'abc' with -32602")
          EOF
          # The CLI and the MCP tool answer the same bytes, both tools.
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"callees","arguments":{"name":"b"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"impact","arguments":{"name":"d","depth":3}}}' \
            | where-are-we --out /tmp/impmap --mcp > /tmp/imp/mcp.jsonl
          where-are-we --out /tmp/impmap --callees b > /tmp/imp/cli-callees.txt
          python - <<'EOF'
          import json, pathlib
          rows = [json.loads(l) for l in open("/tmp/imp/mcp.jsonl")]
          names = sorted(t["name"] for t in rows[0]["result"]["tools"])
          assert names == ["ask", "callees", "callers", "defines", "find",
                           "impact", "more", "sections"], names
          print("tools/list:", len(names), names)
          for i, path in ((1, "/tmp/imp/cli-callees.txt"), (2, "/tmp/imp/d3.txt")):
              mcp = rows[i]["result"]["content"][0]["text"]
              cli = pathlib.Path(path).read_text()
              assert mcp == cli.rstrip("\n"), (path, mcp, cli)
          print("MCP callees/impact and --callees/--impact agree, byte for byte")
          EOF
          # One log line per name, both tools, batched or not.
          rm -f /tmp/impmap/.wawe-ask.log
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"callees","arguments":{"name":["a","b","c"]}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"impact","arguments":{"name":["a","b","c"]}}}' \
            | where-are-we --out /tmp/impmap --mcp > /dev/null
          python - <<'EOF'
          import json
          rows = [json.loads(l) for l in open("/tmp/impmap/.wawe-ask.log")]
          for tool in ("callees", "impact"):
              got = [r["words"] for r in rows if r["tool"] == tool]
              assert got == ["a", "b", "c"], (tool, got)
          print("callees and impact log one line per name")
          EOF
      - name: manifest and hooks
        run: |
          where-are-we --repo /tmp/fx --init && test -f /tmp/fx/.framework-map.json
          git -C /tmp/fx init -q && where-are-we --repo /tmp/fx --install-hook git
          test -x /tmp/fx/.git/hooks/post-checkout
      - name: cursor and codex hooks
        run: |
          rm -rf /tmp/home /tmp/fx2
          export HOME=/tmp/home
          mkdir -p "$HOME" /tmp/fx2
          printf 'def f():\n    pass\n' > /tmp/fx2/a.py
          where-are-we --repo /tmp/fx2 --install-hook cursor | grep -q installed
          test -f /tmp/fx2/.cursor/rules/where-are-we.mdc
