            echo "unexpected match: grep -q 'MIIEowIBAAKCAQEAvR8' /tmp/sec/pem.txt"; exit 1
          fi
          # Code that merely mentions a credential is not a credential. Every
          # one of these was redacted before the secret word had to be the
          # last segment of the identifier.
          python - <<'EOF'
          import json, sys
          lines = set()
          for rows in json.load(open("/tmp/sec/m/framework_map.json"))["lines"].values():
              lines.update(r.strip() for r in rows)
          keep = ['token_count = 3', 'max_token_count = 10', 'has_token = True',
                  'auth_backend = "ldap"', 'secret_name = "prod-db"',
                  'api_key_header = "X-Api-Key"',
                  'private_key_path = "/etc/ssl/key.pem"',
                  'credential_kind = "basic"', 'token: str = ""',
                  '"auth": auth,', 'DISK_CACHE = "disk-cache-0001"',
                  'DOC = "docs/ask-the-map-and-not-the-tree.md"',
                  'work_live_configuration = "on"',
                  # A count has no ceiling. A six-digit cap redacted all
                  # three of these, which are a context window, a buffer
                  # size and a millisecond timeout.
                  'MAX_TOKENS = 1000000', 'max_buffer_tokens = 1048576',
                  'TIMEOUT_TOKEN = 2000000',
                  'max_token = 4096', 'num_tokens = 10',
                  # A quoted value keeps its quotes: the line is still the
                  # syntax it was, and the reader can see it was a literal.
                  'DB_PASSWORD = "[redacted]"']
          missing = [k for k in keep if k not in lines]
          if missing:
              print("redacted something that is not a secret:", missing)
              sys.exit(1)
          # A number under a credential key is a credential. A blanket
          # "digits are safe" rule handed all three of these to the map.
          doc = open("/tmp/sec/m/framework_map.json").read()
          for leak in ["8675309", "12345678", "1234567890123456"]:
              if leak in doc:
                  print("a numeric credential reached the map:", leak)
                  sys.exit(1)
          print("kept", len(keep), "lines that only mention a credential")
          EOF
          # PEM state is per file: b_page's contribution to any aggregated
          # list survives a_page's header. It used to be blanked with it.
          grep -q "distinctive-b-content" /tmp/sec/m/framework_map.json

      - name: every environment variable the code reads is in the README table
