          mkdir -p /tmp/ptm/.wawe
          touch /tmp/ptm/.wawe/framework_map.md
          out=$(printf '%s' '{"cwd":"/tmp/ptm","tool_name":"Bash","tool_input":{"command":"find . -delete"}}' \
            | WAWE_STRICT=1 sh plugin/scripts/prefer-the-map.sh)
          test -z "$out"
          out=$(printf '%s' '{"cwd":"/tmp/ptm","tool_name":"Bash","tool_input":{"command":"grep -rn foo src/"}}' \
            | WAWE_STRICT=1 sh plugin/scripts/prefer-the-map.sh)
          echo "$out" | grep -q permissionDecision
      - name: every artefact is replaced, never truncated in place
        run: |
          rm -rf /tmp/aw
          mkdir -p /tmp/aw/r/pkg /tmp/aw/m
          for i in $(seq 1 400); do
            printf 'C%s = %s\ndef f%s(x):\n    return x\n' "$i" "$i" "$i" > /tmp/aw/r/pkg/m$i.py
          done
          where-are-we --repo /tmp/aw/r --out /tmp/aw/m --force --quiet --no-semantic
          # A reader polling the three map files while a build runs must never
          # see a size other than the settled one. On the old in-place writes
          # every one of them passed through zero bytes.
          (where-are-we --repo /tmp/aw/r --out /tmp/aw/m --force --quiet --no-semantic &)
          python - <<'EOF'
          import os, sys, time
          out = "/tmp/aw/m"
          names = ["framework_map.json", "framework_map.md", "framework_map_brief.md"]
          seen = {n: set() for n in names}
          t0 = time.time()
          while time.time() - t0 < 6:
              for n in names:
                  try:
                      seen[n].add(os.path.getsize(os.path.join(out, n)))
                  except OSError:
                      pass
          bad = []
          for n in names:
              settled = os.path.getsize(os.path.join(out, n))
              other = sorted(s for s in seen[n] if s != settled)
              print(n, "settled", settled, "other sizes seen", other)
              if other:
                  bad.append(n)
          sys.exit(1 if bad else 0)
          EOF
          # A build killed while it writes leaves the previous three files
          # exactly as they were, and no half-written JSON.
          md5_before=$(md5sum /tmp/aw/m/framework_map.json | cut -d" " -f1)
          printf 'KILLED_BUILD_MARKER = 1\n' > /tmp/aw/r/pkg/late.py
          python - <<'EOF'
          import os, signal, subprocess, time
          out = "/tmp/aw/m"
          def watched():
              return {n: os.path.getsize(os.path.join(out, n))
                      for n in os.listdir(out) if n.startswith("framework_map")}
          base = watched()
          p = subprocess.Popen(["where-are-we", "--repo", "/tmp/aw/r", "--out", out,
                                "--force", "--quiet", "--no-semantic"],
                               env=dict(os.environ, WAWE_NO_CACHE="1"))
          t0 = time.time()
          while time.time() - t0 < 60 and p.poll() is None:
              if watched() != base:
                  p.send_signal(signal.SIGTERM)
                  break
          p.wait()
          print("child exit", p.returncode)
          EOF
          test "$(md5sum /tmp/aw/m/framework_map.json | cut -d" " -f1)" = "$md5_before"
          python -c "import json; json.load(open('/tmp/aw/m/framework_map.json'))"
          if grep -q KILLED_BUILD_MARKER /tmp/aw/m/framework_map.json; then
            echo "unexpected match: grep -q KILLED_BUILD_MARKER /tmp/aw/m/framework_map.json"; exit 1
          fi
          # The next build sweeps away the temporary the killed one left.
          where-are-we --repo /tmp/aw/r --out /tmp/aw/m --force --quiet --no-semantic
          test -z "$(find /tmp/aw/m -name '*.tmp')"
          grep -q KILLED_BUILD_MARKER /tmp/aw/m/framework_map.json

      - name: a build starts from nothing, whatever ran before it
        run: |
          rm -rf /tmp/reset
          mkdir -p /tmp/reset/a /tmp/reset/b
          printf 'ONLY_IN_A = 1\ndef shared_name():\n    pass\n' > /tmp/reset/a/alpha.py
          printf 'ONLY_IN_B = 1\ndef shared_name():\n    pass\n' > /tmp/reset/b/beta.py
          # Two repositories in one process, in both orders, against what a
          # fresh process builds. Before the reset, repo B's own map pointed
          # shared_name at a file in repo A and counted A's files as its own.
          python - <<'EOF'
          import json, os, sys
          from where_are_we import mapper
          os.environ["PRODUCT_SRC"] = "none"
          def build(*repos):
              m = None
              for r in repos:
                  os.environ["AGENT_REPO"] = r
                  out = r + ".out"
                  os.makedirs(out, exist_ok=True)
                  m = mapper.build(r, out_dir=out)
              return {"definitions": m["definitions"], "indexed": m["indexed"],
                      "lines": sorted(m["lines"])}
          a, b = "/tmp/reset/a", "/tmp/reset/b"
          alone_a, alone_b = build(a), build(b)
          bad = []
          if build(a, b) != alone_b:
              bad.append("A then B does not give B's own map")
          if build(b, a) != alone_a:
              bad.append("B then A does not give A's own map")
          # --also is the one caller that keeps what is there.
          os.environ["AGENT_REPO"] = a
          mapper.build(a, out_dir=a + ".out")
          os.environ["AGENT_REPO"] = b
          merged = mapper.build(b, out_dir=b + ".out", keep_indexes=True)
          if not {"ONLY_IN_A", "ONLY_IN_B"} <= set(merged["definitions"]):
              bad.append("--also's keep_indexes lost a root: "
                         + str(sorted(merged["definitions"])))
          print("\n".join(bad) or "in-process builds match fresh-process builds")
          sys.exit(1 if bad else 0)
          EOF
          # --also through the CLI still folds the second root in.
          rm -rf /tmp/reset/m
          where-are-we --repo /tmp/reset/a --out /tmp/reset/m --also /tmp/reset/b \
            --product none --force --quiet --no-semantic
          grep -q ONLY_IN_A /tmp/reset/m/framework_map.json
          grep -q ONLY_IN_B /tmp/reset/m/framework_map.json
      - name: --watch on an unchanged tree keeps a constant indexed count
        run: |
          rm -rf /tmp/wc2
          mkdir -p /tmp/wc2/r/pkg /tmp/wc2/m
          printf 'GONE_SOON = 1\ndef keeper():\n    pass\n' > /tmp/wc2/r/pkg/m.py
          where-are-we --repo /tmp/wc2/r --out /tmp/wc2/m --product none \
            --force --quiet --no-semantic
          PYTHONUNBUFFERED=1 where-are-we --repo /tmp/wc2/r --out /tmp/wc2/m \
            --product none --watch 1 --no-semantic > /tmp/wc2/watch.log 2>&1 &
          WP=$!
          sleep 1
          for i in 1 2 3 4; do
            touch /tmp/wc2/r/pkg/m.py
            sleep 2
            python -c "import json; print(json.load(open('/tmp/wc2/m/framework_map.json'))['indexed'])" \
              >> /tmp/wc2/counts.txt
          done
          kill $WP || true
          cat /tmp/wc2/counts.txt
          test "$(sort -u /tmp/wc2/counts.txt | wc -l)" = "1"
          grep -q "'suite': 1" /tmp/wc2/counts.txt

      - name: an edit in the same second as the build is still seen
        run: |
          rm -rf /tmp/fp
          mkdir -p /tmp/fp/r /tmp/fp/m
          # Start on a second boundary so the edit below is certain to land in
          # the same whole second as the build before it. The fingerprint used
          # to be int(newest), so that edit was invisible and the CLI printed
          # "unchanged since it was built" over a map that no longer matched.
          python -c "import time; [time.sleep(0.005) for _ in iter(lambda: time.time() % 1 > 0.05, False)]"
          printf 'ORIGINAL_NAME = 1\n' > /tmp/fp/r/m.py
          where-are-we --repo /tmp/fp/r --out /tmp/fp/m --product none --force --quiet --no-semantic
          grep -q ORIGINAL_NAME /tmp/fp/m/framework_map.json
          printf 'EDITED_NAME = 1\n' > /tmp/fp/r/m.py
          where-are-we --repo /tmp/fp/r --out /tmp/fp/m --product none --no-semantic | tee /tmp/fp/second.txt
          if grep -q "unchanged since it was built" /tmp/fp/second.txt; then
            echo "unexpected match: grep -q 'unchanged since it was built' /tmp/fp/second.txt"; exit 1
          fi
          grep -q EDITED_NAME /tmp/fp/m/framework_map.json
          if grep -q ORIGINAL_NAME /tmp/fp/m/framework_map.json; then
            echo "unexpected match: grep -q ORIGINAL_NAME /tmp/fp/m/framework_map.json"; exit 1
          fi
      - name: every pass over a tree is bounded, so a huge root terminates
        run: |
          rm -rf /tmp/big
          mkdir -p /tmp/big/m
          # 12,000 files across 600 directories, and a cap of 2,000 entries.
          python - <<'EOF'
          import os
          for d in range(600):
              p = f"/tmp/big/r/d{d:03d}"
              os.makedirs(p, exist_ok=True)
              for i in range(20):
                  open(f"{p}/m{i}.py", "w").write(f"C{d}_{i} = 1\n")
          EOF
          # The fingerprint alone: it runs before anything else and used to be
          # the reason --repo / never returned.
          WAWE_MAX_FILES=2000 timeout 60 python -c "
          import os, time
          os.environ['AGENT_REPO'] = '/tmp/big/r'
          from where_are_we._mapper.walk import _fingerprint, TRUNCATED
          t = time.time(); _fingerprint('/tmp/big/r')
          print('fingerprint in %.2fs' % (time.time() - t))
          assert TRUNCATED, 'the cap was not reported'
          print(TRUNCATED[0])"
          WAWE_MAX_FILES=2000 timeout 60 where-are-we --repo /tmp/big/r --out /tmp/big/m \
            --product none --force --quiet --no-semantic
          grep -q "stopped after 2000 entries" /tmp/big/m/framework_map.md
          # Uncapped, the same tree is mapped whole and says nothing about a stop.
          rm -rf /tmp/big/m2
          timeout 120 where-are-we --repo /tmp/big/r --out /tmp/big/m2 \
            --product none --force --quiet --no-semantic
          if grep -q "stopped after" /tmp/big/m2/framework_map.md; then
            echo "unexpected match: grep -q 'stopped after' /tmp/big/m2/framework_map.md"; exit 1
          fi
          grep -q C599_19 /tmp/big/m2/framework_map.json
          # `wawe-eval --graph` walks the tree a second time to compare the
          # map's pattern pass with a real parse. That walk counts entries and
          # stops at the same cap, so the command a reader runs after a build
          # is bounded the way the build is.
          mkdir -p /tmp/big/r2/aaa /tmp/big/r2/zzz
          python - <<'EOF'
          for i in range(3000):
              open(f"/tmp/big/r2/aaa/m{i:04d}.py", "w").write("K = 1\n")
          open("/tmp/big/r2/zzz/late.ts", "w").write("export function pay() {}\n")
          EOF
          WAWE_MAX_FILES=2000 python -c "
          from where_are_we.eval import _walk_source
          found = _walk_source('/tmp/big/r2')
          print('capped at 2000 entries, sources found:', len(found))
          assert found == [], found"
          python -c "
          from where_are_we.eval import _walk_source
          found = _walk_source('/tmp/big/r2')
          print('uncapped, sources found:', len(found))
          assert len(found) == 1, found"

      - name: --force reads nothing from the parse cache and rewrites it
        run: |
          rm -rf /tmp/fc
          mkdir -p /tmp/fc/r /tmp/fc/m
          printf 'def AAA_fn():\n    pass\n' > /tmp/fc/r/m.py
          where-are-we --repo /tmp/fc/r --out /tmp/fc/m --product none --force --quiet --no-semantic
          grep -q AAA_fn /tmp/fc/m/framework_map.json
          # The same byte count, with the old timestamp put back: what rsync
          # --times, cp -p and a restore from a build cache leave behind, and
          # what mtime-and-size cannot tell from no change at all.
          printf 'def BBB_fn():\n    pass\n' > /tmp/fc/r/m.py
          python -c "import os; os.utime('/tmp/fc/r/m.py', (1700000000, 1700000000))"
          where-are-we --repo /tmp/fc/r --out /tmp/fc/m --product none --force --quiet --no-semantic
          grep -q BBB_fn /tmp/fc/m/framework_map.json
          if grep -q AAA_fn /tmp/fc/m/framework_map.json; then
            echo "unexpected match: grep -q AAA_fn /tmp/fc/m/framework_map.json"; exit 1
          fi
          # And the cache is rewritten, so the build after a --force is warm.
          rm -rf /tmp/fc/big /tmp/fc/bm
          mkdir -p /tmp/fc/big
          for i in $(seq 0 29); do printf 'def g%s():\n    return %s\n' "$i" "$i" > /tmp/fc/big/m$i.py; done
          WAWE_DEBUG_PARSES=1 where-are-we --repo /tmp/fc/big --out /tmp/fc/bm \
            --product none --force --quiet --no-semantic 2> /tmp/fc/force.log
          grep -qE "^parsed [1-9][0-9]* files$" /tmp/fc/force.log
          rm /tmp/fc/bm/framework_map.json
          WAWE_DEBUG_PARSES=1 where-are-we --repo /tmp/fc/big --out /tmp/fc/bm \
            --product none --quiet --no-semantic 2> /tmp/fc/warm.log
          grep -q "^parsed 0 files$" /tmp/fc/warm.log
          where-are-we --help | grep -q "read nothing from the parse cache"

      - name: --watch rebuilds whole, writes every file, and survives a failure
        run: |
          # A directory of this run's own, not a fixed /tmp path. A watcher
          # left running by an earlier job on a reused runner would otherwise
          # rebuild this step's output directory every second and make the
          # step pass whatever the code does. That is not hypothetical: it
          # happened on the machine this step was written on, and the step
          # reported a pass against code that fails it.
          W=$(mktemp -d)
          echo "fixture at $W"
          mkdir -p "$W/repo/pkg"
          echo 'def one(): pass' > "$W/repo/pkg/a.py"
          # Every wait is a poll for the condition, never a fixed sleep. A
          # watcher on a loaded runner can be seconds behind, and a sleep long
          # enough to be safe is a sleep that hides a regression making it slow.
          cat > "$W/waitfor.py" <<'PY'
          import json, os, sys, time
          what, deadline = sys.argv[1], time.time() + 30
          js = os.path.join(os.environ["W"], "repo", ".wawe", "framework_map.json")
          while time.time() < deadline:
              try:
                  names = set(json.load(open(js))["definitions"])
              except (OSError, ValueError):
                  names = set()
              if what.startswith("-"):
                  if what[1:] not in names:
                      sys.exit(0)
              elif what in names:
                  sys.exit(0)
              time.sleep(0.2)
          print(f"timed out waiting for {what}", file=sys.stderr)
          try:
              print("names now:", sorted(json.load(open(js))["definitions"]), file=sys.stderr)
          except (OSError, ValueError) as exc:
              print("no readable map:", exc, file=sys.stderr)
          sys.exit(1)
          PY
          export W
          PRODUCT_SRC=none PYTHONUNBUFFERED=1 where-are-we --repo "$W/repo" \
            --out "$W/repo/.wawe" --watch 1 --no-semantic --html \
            > "$W/watch.log" 2>&1 &
          WP=$!
          python "$W/waitfor.py" one
          for i in $(seq 1 20); do
            echo "def f$i(): pass" > "$W/repo/pkg/f$i.py"
          done
          # Every file added while watching is in the map. Before, _WALK_CACHE
          # was never cleared, so 21 rebuilds over 21 files left one name.
          python "$W/waitfor.py" f20
          python - <<'EOF'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["W"], "repo", ".wawe",
                                          "framework_map.json")))
          names = set(d["definitions"])
          missing = [f"f{i}" for i in range(1, 21) if f"f{i}" not in names]
          print(len(names), "names in the map; missing:", missing)
          sys.exit(1 if missing else 0)
          EOF
          # A name deleted from the tree leaves the map.
          rm "$W/repo/pkg/f20.py"
          python "$W/waitfor.py" -f20
          # All three map files, plus the ones the flags asked for. The watch
          # loop used to write only the JSON and the brief, so --ask against a
          # watched directory said there was no map.
          test -s "$W/repo/.wawe/framework_map.md"
          test -s "$W/repo/.wawe/framework_map.html"
          where-are-we --repo "$W/repo" --out "$W/repo/.wawe" --ask one \
            | grep -q "Defined here"
          # One failing iteration is printed and the watcher keeps going.
          rm -rf "$W/repo/.wawe" && : > "$W/repo/.wawe"
          echo 'def boom(): pass' > "$W/repo/pkg/boom.py"
          python - <<'EOF'
          import os, sys, time
          log = os.path.join(os.environ["W"], "watch.log")
          deadline = time.time() + 30
          while time.time() < deadline:
              if "rebuild failed, still watching" in open(log).read():
                  sys.exit(0)
              time.sleep(0.2)
          print("the watcher never reported a failed iteration", file=sys.stderr)
          print(open(log).read(), file=sys.stderr)
          sys.exit(1)
          EOF
          # Alive, and it is still our watcher that is doing the work.
          kill -0 $WP
          rm -f "$W/repo/.wawe"
          echo 'def RECOVERED(): pass' > "$W/repo/pkg/rec.py"
          python "$W/waitfor.py" RECOVERED
          kill $WP || true

      - name: a very large file costs the read limit, not its size
        run: |
          rm -rf /tmp/huge
          mkdir -p /tmp/huge/r /tmp/huge/m
          # Three of them. build.py's whole-file reads were spread across
          # every language it knows, so a .py fixture alone measured four of
          # the sixty-six and left a huge .ts costing 590 MB. And padding is
          # not the worst case for a parser: an ast tree is far bigger than
          # its source and how much bigger depends on how dense the source
          # is, so a file of nothing but one-line defs is what actually
          # bounds AST_LIMIT. Four megabytes of those cost the same peak as
          # two hundred, because the cap is what decides it.
          python -c "open('/tmp/huge/r/huge.py','wb').write(b'x = 1\n' + b'# pad\n'*33000000)"
          python -c "open('/tmp/huge/r/huge.ts','wb').write(b'const x = 1\n' + b'// pad\n'*28000000)"
          python - <<'EOF'
          with open("/tmp/huge/r/dense.py", "w") as fh:
              i = written = 0
              while written < 4 * 1024 * 1024:
                  line = f"def gen_{i:08d}():\n    return {i}\n"
                  fh.write(line)
                  written += len(line)
                  i += 1
          print(f"dense.py: {i} defs")
          EOF
          ls -la /tmp/huge/r/
          python - <<'EOF'
          import resource, subprocess, sys
          subprocess.run(["where-are-we", "--repo", "/tmp/huge/r", "--out", "/tmp/huge/m",
                          "--product", "none", "--force", "--quiet", "--no-semantic"],
                         check=True)
          kb = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
          # ru_maxrss is kilobytes on Linux and bytes on macOS, and this has to
          # mean the same number on a developer's laptop as on the runner.
          if sys.platform == "darwin":
              kb //= 1024
          print(f"peak child RSS {kb / 1024:.0f} MB")
          # Measured on this fixture: 198 MB at AST_LIMIT 1 MB, 370 MB at
          # 2 MB, 1171 MB with the reads unbounded. 320 MB sits above the
          # first with room for a slower allocator and below the second, so
          # the step guards the cap's value as well as the reads themselves.
          sys.exit(1 if kb > 320 * 1024 else 0)
          EOF
          # A module a parser only saw part of is named, and one it read whole
          # is not.
          grep -q "only the first 1 MB was parsed of: /tmp/huge/r/dense.py" \
            /tmp/huge/m/framework_map.md

      - name: the single-file reads are bounded too
        run: |
          rm -rf /tmp/cfg
          mkdir -p /tmp/cfg/r /tmp/cfg/m
          # .wawe.toml, README.md and a steps module are all paths a
          # repository chooses the contents of, and all three were read whole.
          python - <<'EOF'
          with open("/tmp/cfg/r/.wawe.toml", "w") as fh:
              fh.write('[synonyms]\ninvoice = ["proforma"]\n')
              fh.write("# pad\n" * 33000000)
          with open("/tmp/cfg/r/README.md", "w") as fh:
              fh.write('# Title\n\n```framework-map\n{"name": "cfgrepo"}\n```\n')
              fh.write("pad pad pad\n" * 20000000)
          import os
          os.makedirs("/tmp/cfg/r/steps", exist_ok=True)
          with open("/tmp/cfg/r/steps/s.py", "wb") as fh:
              fh.write(b'from behave import step\n@step("a thing")\ndef f(c):\n    pass\n')
              fh.write(b"# pad\n" * 33000000)
          open("/tmp/cfg/r/a.py", "w").write("CFG_NAME = 1\n")
          EOF
          ls -la /tmp/cfg/r/
          python - <<'EOF'
          import resource, subprocess, sys
          subprocess.run(["where-are-we", "--repo", "/tmp/cfg/r", "--out", "/tmp/cfg/m",
                          "--product", "none", "--force", "--quiet", "--no-semantic"],
                         check=True)
          kb = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
          if sys.platform == "darwin":
              kb //= 1024
          print(f"peak child RSS {kb / 1024:.0f} MB")
          # Measured 33 MB after, 878 MB before, on 636 MB of fixture.
          sys.exit(1 if kb > 320 * 1024 else 0)
          EOF
          # Bounded, and still correct: the manifest block near the top of the
          # README is found, the config's synonyms are parsed, and the step
          # phrase at the top of the steps module is indexed.
          python -c "
          import json
          d = json.load(open('/tmp/cfg/m/framework_map.json'))
          assert (d.get('stated') or {}).get('name') == 'cfgrepo', d.get('stated')
          assert 'CFG_NAME' in d['definitions']
          assert d['counts']['steps'] >= 1, d['counts']
          print('manifest, config and steps all read')"
          python -c "
          from where_are_we._mapper.walk import _config
          c = _config('/tmp/cfg/r')
          assert c.get('synonyms') == {'invoice': ['proforma']}, c
          print('synonyms parsed from a 198 MB .wawe.toml')"

      - name: what changed comes back verbatim, whatever the file is called
        run: |
          rm -rf /tmp/cs
          mkdir -p /tmp/cs/r/pkg /tmp/cs/r/.wawe
          git -C /tmp/cs/r init -q
          git -C /tmp/cs/r config user.email t@t
          git -C /tmp/cs/r config user.name t
          printf 'x=1\n' > /tmp/cs/r/pkg/plain.py
          printf 'q=5\n' > "/tmp/cs/r/pkg/x -> y.py"
          git -C /tmp/cs/r add -A && git -C /tmp/cs/r commit -qm one
          # The first call only records HEAD; the second is the one that reports.
          python -c "
          from where_are_we._mapper.render import changed_since
          changed_since('/tmp/cs/r', '/tmp/cs/r/.wawe')"
          printf 'y=2\n' > "/tmp/cs/r/pkg/committed ünicode.py"
          git -C /tmp/cs/r add -A && git -C /tmp/cs/r commit -qm two
          git -C /tmp/cs/r mv "pkg/x -> y.py" "pkg/renamed -> z.py"
          printf 'z=3\n' > "/tmp/cs/r/pkg/café.py"
          printf 'v=6\n' > "/tmp/cs/r/pkg/a b.py"
          git -C /tmp/cs/r status --porcelain
          # Every path named has to be a path that exists. Parsing the text
          # form of git status kept git's own quoting and octal escapes, so
          # "pkg/café.py" was reported as the literal "pkg/caf\303\251.py",
          # and the rename of a file whose name contains " -> " came back as
          # the fragment 'z.py"'.
          python - <<'EOF'
          import os, sys
          from where_are_we._mapper.render import changed_since
          got = changed_since("/tmp/cs/r", "/tmp/cs/r/.wawe")
          missing = [p for p in got if not os.path.exists(os.path.join("/tmp/cs/r", p))]
          for p in got:
              print(repr(p))
          want = {"pkg/a b.py", "pkg/café.py", "pkg/committed ünicode.py",
                  "pkg/renamed -> z.py"}
          lost = sorted(want - set(got))
          print("does not exist:", missing, " not reported:", lost)
          sys.exit(1 if missing or lost else 0)
          EOF

      - name: a symlink out of the repository is not read into the map
        run: |
          rm -rf /tmp/esc
          mkdir -p /tmp/esc/r /tmp/esc/outside/secretdir /tmp/esc/m
          printf 'INSIDE_NAME = 1\n' > /tmp/esc/r/x.py
          printf 'SIBLING = 2\n' > /tmp/esc/r/sibling.py
          printf 'OUTSIDE_SECRET = "hunter2"\n' > /tmp/esc/outside/secretdir/creds.py
          ln -sf /etc/passwd /tmp/esc/r/passwd.py
          ln -sf /tmp/esc/outside/secretdir/creds.py /tmp/esc/r/linkfile.py
          ln -sf /tmp/esc/outside/secretdir /tmp/esc/r/linkdir
          # A link that stays inside the repository is still followed.
          ln -sf /tmp/esc/r/sibling.py /tmp/esc/r/inside_link.py
          where-are-we --repo /tmp/esc/r --out /tmp/esc/m --product none \
            --force --quiet --no-semantic
          if grep -q "root:x:0:0" /tmp/esc/m/framework_map.json; then
            echo "unexpected match: grep -q 'root:x:0:0' /tmp/esc/m/framework_map.json"; exit 1
          fi
          if grep -q hunter2 /tmp/esc/m/framework_map.json; then
            echo "unexpected match: grep -q hunter2 /tmp/esc/m/framework_map.json"; exit 1
          fi
          if grep -q OUTSIDE_SECRET /tmp/esc/m/framework_map.json; then
            echo "unexpected match: grep -q OUTSIDE_SECRET /tmp/esc/m/framework_map.json"; exit 1
          fi
          grep -q INSIDE_NAME /tmp/esc/m/framework_map.json
          grep -q SIBLING /tmp/esc/m/framework_map.json
          grep -q "inside_link.py" /tmp/esc/m/framework_map.json
          # And the map says it left something out rather than looking complete.
          grep -q "a symlink that resolves outside the repository" \
            /tmp/esc/m/framework_map.md

      - name: a broad handler no longer swallows what the parse loop does
        run: |
          rm -rf /tmp/nx
          mkdir -p /tmp/nx/r /tmp/nx/m
          printf 'def f():\n    pass\n' > /tmp/nx/r/a.py
          # A runs API that answers with a list holding one string and one
          # real row. The whole loop used to sit inside `except Exception`, so
          # row.get on the string raised AttributeError and the section came
          # back empty on an endpoint that had data in it.
          python - <<'EOF' &
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(["junk", {"id": "r1", "ticket": "AB-1",
                                              "verdict": "fail",
                                              "summary": "a real row"}]).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8731), H).serve_forever()
          EOF
          SRV=$!
          sleep 2
          where-are-we --repo /tmp/nx/r --out /tmp/nx/m --product none --force \
            --quiet --no-semantic --runs-api http://127.0.0.1:8731
          kill $SRV || true
          grep -q "a real row" /tmp/nx/m/framework_map.json
          # git history and blame still land, and a repository with no git at
          # all still builds: those are what the narrowed handlers are for.
          rm -rf /tmp/nx/g /tmp/nx/gm
          mkdir -p /tmp/nx/g
          git -C /tmp/nx/g init -q
          git -C /tmp/nx/g config user.email t@t
          git -C /tmp/nx/g config user.name "A Person"
          printf 'def f():\n    pass\n' > /tmp/nx/g/a.py
          git -C /tmp/nx/g add -A
          git -C /tmp/nx/g commit -qm "AB-42 first commit"
          where-are-we --repo /tmp/nx/g --out /tmp/nx/gm --product none --force \
            --quiet --no-semantic
          grep -q '"AB-42"' /tmp/nx/gm/framework_map.json
          grep -q "A Person" /tmp/nx/gm/framework_map.json
          where-are-we --repo /tmp/nx/r --out /tmp/nx/m --product none --force \
            --quiet --no-semantic
          # Only the borderline for-each-ref handler is still a broad one.
          test "$(grep -c 'except Exception' src/where_are_we/_mapper/build.py)" = "1"

      - name: a narrow stdout encoding replaces characters instead of crashing
        run: |
          rm -rf /tmp/enc
          mkdir -p /tmp/enc/r /tmp/enc/m
          printf 'def caf\xc3\xa9_login():\n    pass\n' > /tmp/enc/r/m.py
          where-are-we --repo /tmp/enc/r --out /tmp/enc/m --product none \
            --force --quiet --no-semantic
          # pointer() writes an em dash unconditionally, so this used to fail
          # on every repository under an ascii stdout, not only this one.
          PYTHONIOENCODING=ascii where-are-we --repo /tmp/enc/r --out /tmp/enc/m \
            --pointer > /tmp/enc/ptr.txt
          grep -q "framework map" /tmp/enc/ptr.txt
          if grep -q "UnicodeEncodeError" /tmp/enc/ptr.txt; then
            echo "unexpected match: grep -q 'UnicodeEncodeError' /tmp/enc/ptr.txt"; exit 1
          fi
          PYTHONIOENCODING=ascii LC_ALL=C LANG=C where-are-we --repo /tmp/enc/r \
            --out /tmp/enc/m --ask login > /tmp/enc/ask.txt
          grep -q "caf?_login" /tmp/enc/ask.txt
          PYTHONIOENCODING=ascii where-are-we --repo /tmp/enc/r --out /tmp/enc/m \
            --sections > /dev/null
          # MCP answers over an ascii stdout too: JSON-RPC is escaped already,
          # but the server used to die on the first non-ascii log line.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"find","arguments":{"phrase":"login"}}}' \
            | PYTHONIOENCODING=ascii where-are-we --repo /tmp/enc/r \
              --out /tmp/enc/m --mcp > /tmp/enc/mcp.txt
          grep -q '"jsonrpc"' /tmp/enc/mcp.txt

      - name: a UTF-16 source file is decoded, indexed and answerable
        run: |
          rm -rf /tmp/u16
          mkdir -p /tmp/u16/r /tmp/u16/m
          python -c "open('/tmp/u16/r/src.py','wb').write('def cafe_login(): pass\nCONST_X = 1\n'.encode('utf-16'))"
          where-are-we --repo /tmp/u16/r --out /tmp/u16/m --product none \
            --force --quiet --no-semantic
          # The NUL sniff used to call every UTF-16 file binary, so it was not
          # indexed and not even counted as skipped.
          grep -q '"cafe_login"' /tmp/u16/m/framework_map.json
          grep -q '"CONST_X"' /tmp/u16/m/framework_map.json
          python -c "import json,sys; d=json.load(open('/tmp/u16/m/framework_map.json')); sys.exit(0 if sum(d['indexed'].values()) >= 1 else 1)"
          where-are-we --repo /tmp/u16/r --out /tmp/u16/m --ask cafe_login \
            > /tmp/u16/ask.txt
          grep -q "## Defined here" /tmp/u16/ask.txt
          grep -q "cafe_login" /tmp/u16/ask.txt
          # A byte order mark is not proof of text: a compiled file starting
          # FF FE decodes into mojibake instead of failing, and the NUL test
          # cannot catch it any more because the NULs were the encoding.
          rm -rf /tmp/u16/b
          mkdir -p /tmp/u16/b /tmp/u16/bm
          python -c "
          import random
          random.seed(7)
          open('/tmp/u16/b/blob.py','wb').write(bytes([0xFF,0xFE]) + bytes(random.randrange(256) for _ in range(4000)))
          "
          python -c "open('/tmp/u16/b/real.py','wb').write('def cafe_login(): pass\n'.encode('utf-16'))"
          where-are-we --repo /tmp/u16/b --out /tmp/u16/bm --product none \
            --force --quiet --no-semantic
          grep -q '"cafe_login"' /tmp/u16/bm/framework_map.json
          python -c "import json,sys; d=json.load(open('/tmp/u16/bm/framework_map.json')); sys.exit(0 if 'blob.py' not in ' '.join(d['lines']) else 1)"
          python -c "import json,sys; d=json.load(open('/tmp/u16/bm/framework_map.json')); sys.exit(0 if sum(d['indexed'].values()) == 1 else 1)"
          # The gate is 97 per cent printable and random bytes score about 85,
          # so it has to leave room for a real file in several scripts.
          rm -rf /tmp/u16/p /tmp/u16/pm
          mkdir -p /tmp/u16/p /tmp/u16/pm
          python -c "
          prose = ('# Documentaci\u00f3n\n\"\"\"Se connecter \u00e0 la bo\u00eete, \u00e7a marche.\n'
                   '\u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac, \u0420\u0443\u0441\u0441\u043a\u0438\u0439, \u65e5\u672c\u8a9e, \ud55c\uad6d\uc5b4, \u0627\u0644\u0639\u0631\u0628\u064a\u0629.\n\"\"\"\n'
                   'def caf\u00e9_login(mot_de_passe):\n    return True\n')
          open('/tmp/u16/p/p.py','wb').write(prose.encode('utf-16'))
          "
          where-are-we --repo /tmp/u16/p --out /tmp/u16/pm --product none \
            --force --quiet --no-semantic
          python -c "import json,sys; d=json.load(open('/tmp/u16/pm/framework_map.json')); sys.exit(0 if sum(d['indexed'].values()) == 1 else 1)"

      - name: --html escapes repository content instead of interpolating it
        run: |
          rm -rf /tmp/htm
          mkdir -p /tmp/htm/r /tmp/htm/m
          printf 'def f():\n    pass\n' > /tmp/htm/r/a.py
          cat > /tmp/htm/r/.framework-map.json <<'JSON'
          {"name":"x","purpose":"<script>alert(document.cookie)</script>",
           "conventions":["<img src=x onerror=alert(1)>"]}
          JSON
          where-are-we --repo /tmp/htm/r --out /tmp/htm/m --product none \
            --force --quiet --no-semantic --html
          # The page is opened as file://, where script in it can read other
          # local files, and a manifest or a docstring in a cloned repository
          # used to be enough to put script there.
          if grep -q "<script>alert" /tmp/htm/m/framework_map.html; then
            echo "an unescaped <script> tag reached the page"; exit 1
          fi
          # The payload's text survives as text, which is the point; what
          # must not survive is the tag around it.
          if grep -q "<img src=x onerror" /tmp/htm/m/framework_map.html; then
            echo "an unescaped <img> tag reached the page"; exit 1
          fi
          grep -q "&lt;script&gt;alert" /tmp/htm/m/framework_map.html
          grep -q "&lt;img src=x onerror=alert(1)&gt;" /tmp/htm/m/framework_map.html
          # The page itself is still a page: the renderer's own markup stays.
          grep -q "<h1>" /tmp/htm/m/framework_map.html

      - name: a missing map and an unwritable target are one line and a real exit code
        run: |
          rm -rf /tmp/xc
          mkdir -p /tmp/xc/empty /tmp/xc/emptyout /tmp/xc/srv /tmp/xc/rorepo
          printf 'def f():\n    pass\n' > /tmp/xc/srv/a.py
          # --sections got this right; --ask printed the same complaint and
          # returned 0, and --callers answered "nothing in the map calls foo"
          # for a search that never happened.
          for flag in "--ask login" "--callers foo" "--sections" "--pointer"; do
            if where-are-we --repo /tmp/xc/empty --out /tmp/xc/emptyout $flag \
                 2> /tmp/xc/err.txt; then
              echo "$flag returned 0 with no map"; exit 1
            fi
            grep -q "no map at /tmp/xc/emptyout/framework_map.md" /tmp/xc/err.txt
          done
          # --repo that is not a directory: exit 2, and the path in the message.
          printf 'x\n' > /tmp/xc/notadir
          rc=0
          where-are-we --repo /tmp/xc/notadir --out /tmp/xc/emptyout --force \
            --quiet --no-semantic 2> /tmp/xc/err.txt || rc=$?
          test "$rc" = "2"
          grep -q "/tmp/xc/notadir is not a directory" /tmp/xc/err.txt
          # An unwritable --out, --agent-file or --init target: one line naming
          # the path, exit 1, and no traceback.
          mkdir -p /tmp/xc/ro /tmp/xc/ro2
          chmod 500 /tmp/xc/ro /tmp/xc/ro2 /tmp/xc/rorepo
          for cmd in \
            "--repo /tmp/xc/srv --out /tmp/xc/ro/sub" \
            "--repo /tmp/xc/srv --out /tmp/xc/ro2" \
            "--repo /tmp/xc/srv --out /tmp/xc/ok --agent-file /tmp/xc/ro2/AGENTS.md"; do
            if where-are-we $cmd --force --quiet --no-semantic 2> /tmp/xc/err.txt; then
              echo "wrote into a read-only directory: $cmd"; exit 1
            fi
            grep -q "framework_map: cannot write /tmp/xc/ro" /tmp/xc/err.txt
            if grep -q "Traceback" /tmp/xc/err.txt; then
              echo "unexpected match: grep -q 'Traceback' /tmp/xc/err.txt"; exit 1
            fi
          done
          if where-are-we --repo /tmp/xc/rorepo --out /tmp/xc/emptyout --init \
               2> /tmp/xc/err.txt; then exit 1; fi
          grep -q "framework_map: cannot write /tmp/xc/rorepo/.framework-map.json" \
            /tmp/xc/err.txt
          if grep -q "Traceback" /tmp/xc/err.txt; then
            echo "unexpected match: grep -q 'Traceback' /tmp/xc/err.txt"; exit 1
          fi
          chmod 700 /tmp/xc/ro /tmp/xc/ro2 /tmp/xc/rorepo
          # Only a spec map: --ask answers from it, the other three say which
          # file is missing and which one is there.
          rm -rf /tmp/xc/sp
          mkdir -p /tmp/xc/sp /tmp/xc/spr
          printf '# Specification map\n\n## Tickets\n\n- `AB-1` login must reject a blank password\n' \
            > /tmp/xc/sp/spec_map.md
          where-are-we --repo /tmp/xc/spr --out /tmp/xc/sp --ask login > /tmp/xc/sp.txt
          grep -q "AB-1" /tmp/xc/sp.txt
          # Per flag, not per invocation: --ask alongside one of these three
          # used to make the guard stand down and let the branch that runs
          # answer from a directory with no code map in it.
          for flag in "--sections" "--pointer" "--callers foo" \
                      "--ask login --sections" "--ask login --pointer" \
                      "--ask login --callers foo"; do
            if where-are-we --repo /tmp/xc/spr --out /tmp/xc/sp $flag \
                 2> /tmp/xc/err.txt; then
              echo "$flag answered from a spec map"; exit 1
            fi
            grep -q "only --ask reads it" /tmp/xc/err.txt
          done
          # A map that is there still answers, and still returns 0.
          where-are-we --repo /tmp/xc/srv --out /tmp/xc/m --product none --force \
            --quiet --no-semantic
          where-are-we --repo /tmp/xc/srv --out /tmp/xc/m --pointer > /dev/null
          where-are-we --repo /tmp/xc/srv --out /tmp/xc/m --ask f > /dev/null

