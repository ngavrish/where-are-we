name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install . pytest
      - name: tests
        run: pytest tests -q
      - name: golden
        run: python tests/golden/check.py

      - name: ask expands synonyms and stems
        run: |
          mkdir -p /tmp/syn
          printf '%s\n' \
            '# map' \
            '' \
            '## Steps' \
            '- `steps/a.py:3` user signs in with signin()' \
            '- `steps/b.py:9` cart total' \
            > /tmp/syn/framework_map.md
          where-are-we --out /tmp/syn --ask login | tee /tmp/syn-out.txt
          grep -q "signin()" /tmp/syn-out.txt
          ! grep -q "cart total" /tmp/syn-out.txt
          grep -q "also matched: signin" /tmp/syn-out.txt

      - name: .wawe.toml [synonyms] merges into ask, tomllib
        run: |
          mkdir -p /tmp/syncfg/repo /tmp/syncfg/out
          printf '%s\n' \
            '[synonyms]' \
            'invoice = ["proforma", "receipt"]' \
            > /tmp/syncfg/repo/.wawe.toml
          printf '%s\n' \
            '# map' \
            '' \
            '## Billing' \
            '- `app/billing.py:5` handles the proforma export for a customer' \
            > /tmp/syncfg/out/framework_map.md
          where-are-we --repo /tmp/syncfg/repo --out /tmp/syncfg/out --ask invoice | tee /tmp/syncfg-out.txt
          grep -q "also matched:.*proforma" /tmp/syncfg-out.txt
          # The way a hook or the plugin starts the server: no --repo, the map
          # under <repo>/.wawe. The repository is the parent of that directory
          # and its [synonyms] must still reach the answer.
          rm -rf /tmp/syncfg/repo/.wawe && cp -R /tmp/syncfg/out /tmp/syncfg/repo/.wawe
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"ask","arguments":{"words":"invoice"}}}' \
            | (cd / && where-are-we --out /tmp/syncfg/repo/.wawe --mcp) | tee /tmp/syncfg-mcp.txt
          grep -q "also matched:.*proforma" /tmp/syncfg-mcp.txt

      - name: the facade after the split
        run: |
          set -o pipefail
          rm -rf /tmp/fac /tmp/facmap /tmp/flat
          mkdir -p /tmp/fac
          printf 'def charge(x):\n    return x\n' > /tmp/fac/billing.py
          # Both ways of running it, and the entry point in between.
          python -m where_are_we.mapper --repo /tmp/fac --out /tmp/facmap --quiet
          test -s /tmp/facmap/framework_map_brief.md
          python src/where_are_we/mapper.py --repo /tmp/fac --out /tmp/facmap --force --quiet
          where-are-we --repo /tmp/fac --out /tmp/facmap --force --quiet
          # Every name the tests, mcp.py, hooks.py, lsp.py and the plugin reach
          # for through `mapper.` still resolves through the facade.
          python - <<'EOF'
          from where_are_we import mapper
          for name in ("build brief digest for_audience init_manifest install_hook main pointer "
                       "ask find_text index_lines index_declarations meaning_tail propose_docs "
                       "changed_since declarations_in POINTER_MAX PARSE_COUNT _cap_sections "
                       "_definitions_for _load_parse_cache _save_parse_cache _config _fingerprint "
                       "_walk _slurp _cached redact DEFINITIONS INDEXED LINES TRUNCATED "
                       "_WALK_CACHE _IGNORE_CACHE _FILE_CACHE _PARSE_CACHE CACHE_SCHEMA").split():
              assert hasattr(mapper, name), name
          EOF
          # Assigning the shared state through the facade reaches the module the
          # package counts into, which is what tests/golden/check.py depends on.
          python - <<'EOF'
          from where_are_we import mapper
          from where_are_we._mapper import state
          mapper.PARSE_COUNT = 0
          assert state.PARSE_COUNT == 0
          mapper.build("/tmp/fac")
          assert mapper.PARSE_COUNT == state.PARSE_COUNT > 0, mapper.PARSE_COUNT
          assert mapper.DEFINITIONS is state.DEFINITIONS
          EOF
          # Every code path the split touched, including the two the golden
          # suite does not reach. `--pointer` and `--docs` are how the map is
          # actually read and how it offers a repository its documentation, and
          # both live in modules that gained a package level.
          where-are-we --out /tmp/facmap --pointer | grep -q "framework map"
          where-are-we --out /tmp/facmap --sections | grep -q "Where things are"
          docs_out=$(where-are-we --repo /tmp/fac --out /tmp/facmap --docs)
          test -n "$docs_out"
          # A name a moved function reads but its new module never imported is
          # a NameError nothing sees until that branch runs. symtable finds all
          # of them without running anything.
          python - <<'EOF'
          import builtins, pathlib, symtable, sys
          bad = []
          for path in sorted(pathlib.Path("src/where_are_we").rglob("*.py")):
              text = path.read_text()
              table = symtable.symtable(text, str(path), "exec")
              top = {s.get_name() for s in table.get_symbols() if s.is_assigned()
                     or s.is_imported()}
              def check(t, where):
                  for sym in t.get_symbols():
                      name = sym.get_name()
                      if (sym.is_global() and not sym.is_assigned()
                              and name not in top and not hasattr(builtins, name)):
                          bad.append(f"{path}: {where}: {name}")
                  for child in t.get_children():
                      check(child, where + "." + child.get_name())
              check(table, str(path))
          print("\n".join(bad) or "no undefined module-level names")
          sys.exit(1 if bad else 0)
          EOF
          # The deb and the rpm copy the tree by hand: a flat copy of *.py would
          # ship the facade with nothing behind it.
          mkdir -p /tmp/flat/where_are_we
          cp -R src/where_are_we/. /tmp/flat/where_are_we/
          python -c 'import sys; sys.path.insert(0, "/tmp/flat"); from where_are_we.mapper import main; sys.argv = ["where-are-we", "--repo", "/tmp/fac", "--out", "/tmp/facmap", "--force", "--quiet"]; sys.exit(main())'
      - name: map itself
        run: |
          rm -rf /tmp/map
          where-are-we --repo . --out /tmp/map && test -s /tmp/map/framework_map_brief.md
      - name: map a polyglot fixture
        run: |
          rm -rf /tmp/fx /tmp/fxmap
          mkdir -p /tmp/fx/steps /tmp/fx/migrations
          printf 'from behave import step\n@step("a user exists")\ndef f(c):\n    pass\n' > /tmp/fx/steps/a.py
          printf 'Given("a logged in user", async function () {});\n' > /tmp/fx/steps.ts
          printf 'func TestFoo(t *testing.T) {}\n' > /tmp/fx/main_test.go
          printf 'CREATE TABLE users (id int, email text);\n' > /tmp/fx/migrations/V1__init.sql
          where-are-we --repo /tmp/fx --out /tmp/fxmap
          grep -q "cucumber-js" /tmp/fxmap/framework_map_brief.md
          grep -q "users" /tmp/fxmap/framework_map_brief.md
      - name: cross-file call graph (ts/js, go)
        run: |
          rm -rf /tmp/cg /tmp/cgmap
          mkdir -p /tmp/cg
          printf 'export function charge(x) { return x }\n' > /tmp/cg/a.ts
          printf 'import { charge } from "./a"\nexport async function pay() {\n  const r = charge(1)\n  return r\n}\nfunction local() { return pay() }\n' > /tmp/cg/b.ts
          printf 'package m\nfunc Serve() {}\n' > /tmp/cg/s.go
          printf 'package m\nfunc Run() { Serve() }\n' > /tmp/cg/c.go
          where-are-we --repo /tmp/cg --out /tmp/cgmap
          grep -q "charge (a.ts)" /tmp/cgmap/framework_map_brief.md
          grep -q "Serve (s.go)" /tmp/cgmap/framework_map_brief.md
          ! grep -q "b.ts:local" /tmp/cgmap/framework_map_brief.md
      - name: map a rust/kotlin/csharp/ruby fixture
        run: |
          rm -rf /tmp/langs /tmp/langsmap
          mkdir -p /tmp/langs
          printf 'pub fn charge() {}\nstruct Invoice;\npub(crate) enum State { A }\ntrait Pay {}\n// fn commented() {}\n' > /tmp/langs/lib.rs
          printf 'class Invoice(val id: Int)\nfun charge(): Unit = Unit\nobject Config\nsuspend fun refund() {}\n' > /tmp/langs/Pay.kt
          printf 'public class Invoice {\n  public static void Charge() {}\n  private int Total() => 1;\n}\npublic interface IPay {}\n' > /tmp/langs/Pay.cs
          printf 'module Billing\n  class Invoice\n    def charge?\n    end\n    def self.refund\n    end\n  end\nend\n' > /tmp/langs/pay.rb
          where-are-we --repo /tmp/langs --out /tmp/langsmap
          # Exact "Defined here" rows, name and file:line together, so a
          # dropped construct (a missed `trait Pay`, a `fun charge` that
          # stops matching) fails here instead of passing on a coincidental
          # substring hit elsewhere in the map.
          grep -qF '`Pay` — /tmp/langs/lib.rs:4' /tmp/langsmap/framework_map*.md
          grep -qF '`State` — /tmp/langs/lib.rs:3' /tmp/langsmap/framework_map*.md
          grep -qF '`Invoice` — /tmp/langs/Pay.cs:1' /tmp/langsmap/framework_map*.md
          grep -qF '`Charge` — /tmp/langs/Pay.cs:2' /tmp/langsmap/framework_map*.md
          grep -qF '`Total` — /tmp/langs/Pay.cs:3' /tmp/langsmap/framework_map*.md
          grep -qF '`IPay` — /tmp/langs/Pay.cs:5' /tmp/langsmap/framework_map*.md
          grep -qF '`charge` — /tmp/langs/Pay.kt:2' /tmp/langsmap/framework_map*.md
          grep -qF '`Config` — /tmp/langs/Pay.kt:3' /tmp/langsmap/framework_map*.md
          grep -qF '`refund` — /tmp/langs/Pay.kt:4' /tmp/langsmap/framework_map*.md
          grep -qF '`Billing` — /tmp/langs/pay.rb:1' /tmp/langsmap/framework_map*.md
          grep -qF '`charge?` — /tmp/langs/pay.rb:3' /tmp/langsmap/framework_map*.md
          ! grep -q "commented" /tmp/langsmap/framework_map*.md
      - name: who calls X
        run: |
          mkdir -p /tmp/wc
          printf 'def f():\n    return 1\n' > /tmp/wc/x.py
          printf 'from x import f\n\ndef g():\n    return f()\n' > /tmp/wc/y.py
          where-are-we --repo /tmp/wc --out /tmp/wcmap
          where-are-we --out /tmp/wcmap --callers f | grep -qx "y.py:g"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"callers","arguments":{"name":"f"}}}' \
            | where-are-we --out /tmp/wcmap --mcp \
            | grep -q "f: y.py:g"
      - name: manifest and hooks
        run: |
          where-are-we --repo /tmp/fx --init && test -f /tmp/fx/.framework-map.json
          git -C /tmp/fx init -q && where-are-we --repo /tmp/fx --install-hook git
          test -x /tmp/fx/.git/hooks/post-checkout
      - name: cursor and codex hooks
        run: |
          rm -rf /tmp/home /tmp/fx2
          export HOME=/tmp/home
          mkdir -p "$HOME" /tmp/fx2
          printf 'def f():\n    pass\n' > /tmp/fx2/a.py
          where-are-we --repo /tmp/fx2 --install-hook cursor | grep -q installed
          test -f /tmp/fx2/.cursor/rules/where-are-we.mdc
          grep -q "where-are-we" /tmp/fx2/.cursor/mcp.json
          where-are-we --repo /tmp/fx2 --install-hook cursor | grep -q already
          where-are-we --repo /tmp/fx2 --install-hook codex | grep -q installed
          grep -q "mcp_servers.where-are-we" "$HOME/.codex/config.toml"
          where-are-we --repo /tmp/fx2 --install-hook codex | grep -q already
      - name: idempotent
        run: |
          where-are-we --repo . --out /tmp/map | tee /tmp/first
          where-are-we --repo . --out /tmp/map | grep -q "unchanged since it was built"
      - name: incremental rebuild
        run: |
          mkdir -p /tmp/ir/r/steps /tmp/ir/r/app
          for i in $(seq 0 29); do
            printf 'from behave import step\n@step("thing %s")\ndef f%s(c):\n    c.page.go%s()\n' "$i" "$i" "$i" > /tmp/ir/r/steps/s$i.py
            printf 'def g%s():\n    return %s\n' "$i" "$i" > /tmp/ir/r/app/m$i.py
          done
          rm -rf /tmp/ir/m
          WAWE_DEBUG_PARSES=1 where-are-we --repo /tmp/ir/r --out /tmp/ir/m --force --quiet 2> /tmp/ir/cold.log
          grep -qE "^parsed [1-9][0-9]* files$" /tmp/ir/cold.log
          # A rebuild of a tree nobody touched parses nothing. The map is
          # removed rather than passing --force, because --force means "read
          # nothing from the cache" and would parse everything again on
          # purpose; without it the fingerprint check would skip the build
          # entirely and there would be no parse count to look at.
          rm /tmp/ir/m/framework_map.json
          WAWE_DEBUG_PARSES=1 where-are-we --repo /tmp/ir/r --out /tmp/ir/m --quiet 2> /tmp/ir/warm.log
          grep -q "^parsed 0 files$" /tmp/ir/warm.log
          # And --force really does parse everything again.
          WAWE_DEBUG_PARSES=1 where-are-we --repo /tmp/ir/r --out /tmp/ir/m --force --quiet 2> /tmp/ir/forced.log
          grep -qE "^parsed [1-9][0-9]* files$" /tmp/ir/forced.log
          rm -rf /tmp/ir/nocache
          WAWE_NO_CACHE=1 where-are-we --repo /tmp/ir/r --out /tmp/ir/nocache --force --quiet
          for f in framework_map.json framework_map.md framework_map_brief.md; do
            grep -v '"fingerprint"' /tmp/ir/m/$f > /tmp/ir/m_$f.stripped
            grep -v '"fingerprint"' /tmp/ir/nocache/$f > /tmp/ir/nocache_$f.stripped
            diff /tmp/ir/m_$f.stripped /tmp/ir/nocache_$f.stripped
          done

      - name: measure a synthetic session
        run: |
          rm -rf /tmp/ms
          mkdir -p /tmp/ms
          printf '%s\n' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "Grep", "input": {"pattern": "x"}}]}}' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "Bash", "input": {"command": "cd /r && grep -rn foo ."}}]}}' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "mcp__plugin_where-are-we_where-are-we__ask", "input": {"words": "foo"}}]}}' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "Read", "input": {"file_path": "/r/a.py"}}]}}' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "Edit", "input": {"file_path": "/r/a.py"}}]}}' \
            '{"type": "user", "message": {"role": "user", "content": []}}' \
            '{"type": "assistant", "message": {"role": "assistant", "content": [{"type": "tool_use", "name": "Bash", "input": {"command": "pytest -q"}}]}}' \
            > /tmp/ms/s1.jsonl
          wawe-measure --sessions /tmp/ms | tee /tmp/ms.table
          grep -E "^s1\.jsonl[[:space:]]+6[[:space:]]+2[[:space:]]+1[[:space:]]+1[[:space:]]+3[[:space:]]+4[[:space:]]*$" /tmp/ms.table
          wawe-measure --sessions /tmp/ms --json | tee /tmp/ms.json
          grep -q '"turns": 6' /tmp/ms.json
          grep -q '"searches": 2' /tmp/ms.json
          grep -q '"map_calls": 1' /tmp/ms.json
          grep -q '"orientation_turns": 4' /tmp/ms.json
      - name: lsp
        run: |
          set -o pipefail
          rm -rf /tmp/lsp
          mkdir -p /tmp/lsp/r
          printf 'def charge(x):\n    return x\n' > /tmp/lsp/r/billing.py
          printf 'from billing import charge\n\ndef pay():\n    return charge(1)\n' > /tmp/lsp/r/api.py
          where-are-we --repo /tmp/lsp/r --out /tmp/lsp/m --force
          python docs/examples/lsp-smoke.py /tmp/lsp/r /tmp/lsp/m | tee /tmp/lsp-smoke.out
          # "billing.py" is in every reply, pass or fail (it's the uri in
          # reply 2's raw JSON); the smoke script's actual verdict is its
          # last line, OK on success and FAILED on any check failing.
          grep -qx OK /tmp/lsp-smoke.out
      - name: "spec source: github"
        run: |
          rm -rf /tmp/ghbin /tmp/ghrepo /tmp/ghmap
          mkdir -p /tmp/ghbin /tmp/ghrepo
          cat > /tmp/ghbin/gh <<'SH'
          #!/bin/sh
          # gh's own argv is issue/view/<number>/--repo/..., so the number
          # substituted for {key} lands at $3, not $2.
          echo "{\"number\": $3, \"title\": \"t $3\", \"body\": \"see #7\", \"comments\": []}"
          SH
          chmod +x /tmp/ghbin/gh
          git -C /tmp/ghrepo init -q
          git -C /tmp/ghrepo remote add origin git@github.com:acme/shop.git
          PATH="/tmp/ghbin:$PATH" where-are-we --repo /tmp/ghrepo --out /tmp/ghmap \
            --specs '#12' --spec-source github --quiet
          grep -q '#12' /tmp/ghmap/spec_map.md
          grep -q '#7' /tmp/ghmap/spec_map.md
      - name: "spec source: github rejects a malicious origin"
        run: |
          rm -rf /tmp/ghpwn /tmp/ghpwnmap
          rm -f /tmp/PWNED_MARKER
          mkdir -p /tmp/ghpwn
          git -C /tmp/ghpwn init -q
          # No slash in the injected suffix: the owner/name regex still
          # matches (a slash there would already fall through to the plain
          # "no github.com match" refusal), so this exercises the new name
          # validation itself.
          git -C /tmp/ghpwn remote add origin 'https://github.com/o/n;touch${IFS}PWNED_MARKER'
          cd /tmp
          if where-are-we --repo /tmp/ghpwn --out /tmp/ghpwnmap \
            --specs '#1' --spec-source github --quiet; then
            echo "expected --spec-source github to refuse this origin" >&2
            exit 1
          fi
          test ! -e /tmp/PWNED_MARKER
      - name: every map answer is logged
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"ask","arguments":{"words":"charge"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"find","arguments":{"phrase":"charge"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"defines","arguments":{"name":"charge"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"sections","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"callers","arguments":{"name":"charge"}}}' \
            | where-are-we --out /tmp/map --mcp
          grep -q '"tool": "ask"' /tmp/map/.wawe-ask.log
          grep -q '"tool": "find"' /tmp/map/.wawe-ask.log
          grep -q '"tool": "defines"' /tmp/map/.wawe-ask.log
          grep -q '"tool": "sections"' /tmp/map/.wawe-ask.log
          grep -q '"tool": "callers"' /tmp/map/.wawe-ask.log
          # The CHANGELOG says every one of these is logged from both the CLI
          # and MCP, above; the CLI's own --sections is the one flag that
          # historically forgot to log, so check it here too.
          where-are-we --out /tmp/map --sections >/dev/null
          grep -q '"tool": "sections"' /tmp/map/.wawe-ask.log
          wawe-measure --ask-log /tmp/map | tee /tmp/ask-log-summary.txt
          grep -q "^n=" /tmp/ask-log-summary.txt
      - name: pointer says what changed since the last session
        run: |
          rm -rf /tmp/pd
          mkdir -p /tmp/pd/r /tmp/pd/m
          git -C /tmp/pd/r init -q
          git -C /tmp/pd/r config user.email t@t
          git -C /tmp/pd/r config user.name t
          printf 'x=1\n' > /tmp/pd/r/a.py
          git -C /tmp/pd/r add .
          git -C /tmp/pd/r commit -qm one
          where-are-we --repo /tmp/pd/r --out /tmp/pd/m --force
          export AGENT_REPO=/tmp/pd/r
          where-are-we --out /tmp/pd/m --pointer > /tmp/pd/first.txt
          ! grep -q "file.* changed" /tmp/pd/first.txt
          printf 'y=2\n' > /tmp/pd/r/b.py
          git -C /tmp/pd/r add .
          git -C /tmp/pd/r commit -qm two
          printf 'z=3\n' > /tmp/pd/r/c.py
          where-are-we --out /tmp/pd/m --pointer > /tmp/pd/second.txt
          grep -q "2 files changed" /tmp/pd/second.txt

      - name: mcp malformed params/arguments/limit get a JSON-RPC error, not a dead server
        run: |
          rm -rf /tmp/mcperr
          mkdir -p /tmp/mcperr/pkg
          printf 'def charge(x):\n    return x\n' > /tmp/mcperr/pkg/billing.py
          where-are-we --repo /tmp/mcperr --out /tmp/mcperr/.wawe --force --no-semantic --quiet
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":[1,2,3]}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ask","arguments":["x"]}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"find","arguments":{"phrase":"charge","limit":"abc"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"ask","arguments":{"words":"charge"}}}' \
            | where-are-we --repo /tmp/mcperr --out /tmp/mcperr/.wawe --mcp | tee /tmp/mcperr-out.txt
          grep -q '"id": 1, "error": {"code": -32602' /tmp/mcperr-out.txt
          grep -q '"id": 2, "error": {"code": -32602' /tmp/mcperr-out.txt
          grep -q '"id": 3, "error": {"code": -32602' /tmp/mcperr-out.txt
          # A bad request earlier on the same pipe must not take the server
          # down: the next, well-formed request still gets answered.
          grep -q '"id": 4, "result"' /tmp/mcperr-out.txt

      - name: lsp malformed params get a JSON-RPC error; file:// URI is percent-encoded
        run: |
          rm -rf "/tmp/lsperr"
          mkdir -p "/tmp/lsperr/repo café"
          printf 'def charge(x):\n    return x\n' > "/tmp/lsperr/repo café/billing.py"
          printf 'from billing import charge\n\ndef pay():\n    return charge(1)\n' > "/tmp/lsperr/repo café/api.py"
          where-are-we --repo "/tmp/lsperr/repo café" --out /tmp/lsperr/m --force --no-semantic --quiet
          python - <<'EOF'
          import json
          import subprocess

          def frame(obj):
              body = json.dumps(obj).encode()
              return b"Content-Length: %d\r\n\r\n%s" % (len(body), body)

          messages = [
              frame({"jsonrpc": "2.0", "id": 1,
                     "method": "textDocument/definition", "params": [1, 2]}),
              frame({"jsonrpc": "2.0", "id": 2,
                     "method": "workspace/symbol", "params": {"query": "cha"}}),
          ]
          proc = subprocess.run(
              ["where-are-we", "--repo", "/tmp/lsperr/repo café",
               "--out", "/tmp/lsperr/m", "--lsp"],
              input=b"".join(messages), capture_output=True, timeout=30)
          out = proc.stdout.decode()
          assert '"code": -32602' in out, out
          # A path with a space and a non-ASCII character comes back
          # percent-encoded (Path.as_uri()), not raw: an editor can open it.
          assert "repo%20caf%C3%A9" in out, out
          # The bad request above did not end the session.
          assert '"name": "charge"' in out, out
          assert proc.returncode == 0, proc.returncode
          print("lsp malformed params and unicode URI: OK")
          EOF

