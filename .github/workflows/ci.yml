          names = set()
          import pathlib
          for path in pathlib.Path("src/where_are_we").rglob("*.py"):
              body = io.open(path, encoding="utf-8").read()
              # A name in a comment is an example, not a read.
              body = "\n".join(l for l in body.splitlines()
                                if not l.lstrip().startswith("#"))
              names |= set(re.findall(
                  r"os\.(?:environ\.get|getenv)\(\s*[\"']([A-Z][A-Z0-9_]*)[\"']", body))
              names |= set(re.findall(
                  r"os\.environ\[\s*[\"']([A-Z][A-Z0-9_]*)[\"']", body))
          names -= {"HOME"}  # the user's home, not this tool's configuration
          readme = io.open("README.md", encoding="utf-8").read()
          table = readme.split("## Environment", 1)[1].split("## Keeping it honest", 1)[0]
          missing = sorted(n for n in names if "`%s`" % n not in table)
          if missing:
              print("undocumented environment variables:", missing)
              sys.exit(1)
          print("documented:", len(names), "variables")
          EOF
      - name: an optional source that misbehaves does not end the build
        run: |
          rm -rf /tmp/opt
          mkdir -p /tmp/opt/r /tmp/opt/m
          printf 'def f():\n    pass\n' > /tmp/opt/r/a.py
          # --runs-api pointed at a socket that answers something that is not
          # HTTP. http.client.BadStatusLine is an HTTPException, which is not
          # an OSError, so it escaped every handler and ended a build over a
          # flag whose whole purpose is optional history.
          python - <<'EOF'
          import socket, subprocess, sys, threading
          srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("127.0.0.1", 0))
          port = srv.getsockname()[1]
          srv.listen(5)
          def serve():
              while True:
                  try:
                      c, _ = srv.accept()
                  except OSError:
                      return
                  try:
                      c.recv(4096)
                      c.sendall(b"GARBAGE NOT HTTP\r\n\r\n")
                  finally:
                      c.close()
          threading.Thread(target=serve, daemon=True).start()
          r = subprocess.run(["where-are-we", "--repo", "/tmp/opt/r", "--out", "/tmp/opt/m",
                              "--product", "none", "--force", "--quiet", "--no-semantic",
                              "--runs-api", f"http://127.0.0.1:{port}"],
                             capture_output=True, text=True)
          print("exit:", r.returncode)
          print(r.stderr[-400:])
          sys.exit(0 if r.returncode == 0 else 1)
          EOF
          test -s /tmp/opt/m/framework_map.md
          # A git author whose name is not ASCII, read under a C locale.
          # text=True decodes with the locale, so this raised UnicodeDecodeError
          # out of subprocess itself and no handler named it.
          rm -rf /tmp/opt/g /tmp/opt/gm
          mkdir -p /tmp/opt/g
          git -C /tmp/opt/g init -q
          git -C /tmp/opt/g config user.email t@t
          git -C /tmp/opt/g config user.name "Renée Müller"
          printf 'def f():\n    pass\n' > /tmp/opt/g/a.py
          git -C /tmp/opt/g add -A
          git -C /tmp/opt/g commit -qm "AB-42 café support"
          LC_ALL=C LANG=C PYTHONCOERCECLOCALE=0 PYTHONUTF8=0 \
            where-are-we --repo /tmp/opt/g --out /tmp/opt/gm --product none \
            --force --quiet --no-semantic
          # git emits UTF-8 whatever the locale is, so the name is not merely
          # survived, it is exact.
          python -c "
          import json
          d = json.load(open('/tmp/opt/gm/framework_map.json'))
          assert d['blame_owners'] == {'a.py': ['Renée Müller (1)']}, d['blame_owners']
          assert 'AB-42' in d['ticket_links'], d['ticket_links']
          print('blame and tickets intact under LC_ALL=C:', d['blame_owners'])"
          # And no handler reaches for a module that only its try block imports.
          grep -n "^import subprocess" src/where_are_we/_mapper/build.py
          grep -n "^import http.client" src/where_are_we/_mapper/build.py
          test "$(grep -c '        import subprocess' src/where_are_we/_mapper/build.py)" = "0"

      - name: the fingerprint watches exactly the files the map indexes
        run: |
          rm -rf /tmp/fpx
          mkdir -p /tmp/fpx/r /tmp/fpx/m
          # Nine languages the map indexes and the fingerprint used to ignore.
          # Editing one of them moved the map's contents and not its
          # fingerprint, so the next build said "unchanged since it was built"
          # and served the old answer.
          printf 'package m\n\nfunc ORIGINAL_GO() {}\n' > /tmp/fpx/r/main.go
          printf 'pub fn ORIGINAL_RS() {}\n' > /tmp/fpx/r/lib.rs
          printf 'fun ORIGINAL_KT() {}\n' > /tmp/fpx/r/App.kt
          printf 'public class ORIGINAL_CS {}\n' > /tmp/fpx/r/App.cs
          printf 'def ORIGINAL_RB\nend\n' > /tmp/fpx/r/app.rb
          where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none \
            --force --quiet --no-semantic
          grep -q ORIGINAL_GO /tmp/fpx/m/framework_map.json
          for pair in "main.go:package m\n\nfunc EDITED_GO() {}\n:EDITED_GO:ORIGINAL_GO" \
                      "lib.rs:pub fn EDITED_RS() {}\n:EDITED_RS:ORIGINAL_RS" \
                      "App.kt:fun EDITED_KT() {}\n:EDITED_KT:ORIGINAL_KT" \
                      "App.cs:public class EDITED_CS {}\n:EDITED_CS:ORIGINAL_CS" \
                      "app.rb:def EDITED_RB\nend\n:EDITED_RB:ORIGINAL_RB"; do
            file=${pair%%:*}; rest=${pair#*:}
            body=${rest%%:*}; rest=${rest#*:}
            want=${rest%%:*}; gone=${rest#*:}
            sleep 1.1
            printf "$body" > /tmp/fpx/r/$file
            where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none \
              --no-semantic | tee /tmp/fpx/out.txt
            ! grep -q "unchanged since it was built" /tmp/fpx/out.txt
            grep -q "$want" /tmp/fpx/m/framework_map.json
            ! grep -q "$gone" /tmp/fpx/m/framework_map.json
          done
          # A tree nobody touched still does not rebuild.
          where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none --no-semantic \
            | grep -q "unchanged since it was built"
          # And an ignored directory is pruned by the walk as well as by the
          # fingerprint, so a bare directory name in .gitignore means what it
          # means to git: at any depth. But nothing git already tracks is
          # dropped, because git would not drop it either: an ignore rule says
          # what to start tracking, not what to forget.
          rm -rf /tmp/fpx/ig /tmp/fpx/igm
          mkdir -p /tmp/fpx/ig/pkg/build_output /tmp/fpx/ig/other/build_output
          git -C /tmp/fpx/ig init -q
          git -C /tmp/fpx/ig config user.email t@t
          git -C /tmp/fpx/ig config user.name t
          printf 'build_output/\n' > /tmp/fpx/ig/.gitignore
          printf 'KEPT_NAME = 1\n' > /tmp/fpx/ig/pkg/a.py
          printf 'TRACKED_ANYWAY = 1\n' > /tmp/fpx/ig/pkg/build_output/tracked.py
          printf 'UNTRACKED_IGNORED = 1\n' > /tmp/fpx/ig/other/build_output/untracked.py
          git -C /tmp/fpx/ig add .gitignore pkg/a.py
          git -C /tmp/fpx/ig add -f pkg/build_output/tracked.py
          git -C /tmp/fpx/ig commit -qm one
          where-are-we --repo /tmp/fpx/ig --out /tmp/fpx/igm --product none \
            --force --quiet --no-semantic
          grep -q KEPT_NAME /tmp/fpx/igm/framework_map.json
          grep -q TRACKED_ANYWAY /tmp/fpx/igm/framework_map.json
          ! grep -q UNTRACKED_IGNORED /tmp/fpx/igm/framework_map.json
          # .wawe-ignore is a different statement and nothing overrides it.
          # It is this tool being told what not to read, where .gitignore is
          # git being told what not to track, and a vendored tree is routinely
          # committed and still something nobody wants in the map.
          rm -rf /tmp/fpx/vend /tmp/fpx/vendm
          mkdir -p /tmp/fpx/vend/pkg /tmp/fpx/vend/vendor
          git -C /tmp/fpx/vend init -q
          git -C /tmp/fpx/vend config user.email t@t
          git -C /tmp/fpx/vend config user.name t
          printf 'vendor/\n' > /tmp/fpx/vend/.wawe-ignore
          printf 'KEPT_NAME = 1\n' > /tmp/fpx/vend/pkg/a.py
          printf 'VENDORED_NAME = 1\n' > /tmp/fpx/vend/vendor/lib.py
          git -C /tmp/fpx/vend add -A
          git -C /tmp/fpx/vend commit -qm one
          git -C /tmp/fpx/vend ls-files | grep -q vendor/lib.py
          where-are-we --repo /tmp/fpx/vend --out /tmp/fpx/vendm --product none \
            --force --quiet --no-semantic
          grep -q KEPT_NAME /tmp/fpx/vendm/framework_map.json
          ! grep -q VENDORED_NAME /tmp/fpx/vendm/framework_map.json
          # A repository that commits something its own .gitignore names keeps
          # it in the map. This one does: it says `.wawe/` and tracks three
          # example maps under docs/examples/*/.wawe/.
          rm -rf /tmp/fpx/selfm
          where-are-we --repo . --out /tmp/fpx/selfm --product none --force \
            --quiet --no-semantic
          python - <<'EOF'
          import json, subprocess, sys
          d = json.load(open("/tmp/fpx/selfm/framework_map.json"))
          indexed = set(d["lines"])
          tracked = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                   check=True).stdout.split(b"\0")
          want = [p.decode() for p in tracked if p.endswith(b"/.wawe/framework_map.md")]
          import os
          missing = [w for w in want
                     if os.path.abspath(w) not in indexed]
          print(f"{len(want)} tracked example maps, missing from the index: {missing}")
          sys.exit(1 if not want or missing else 0)
          EOF

      - name: a pipe does not hang the build, and dead temporaries are swept
        run: |
          rm -rf /tmp/nr
          mkdir -p /tmp/nr/r /tmp/nr/m
          printf 'KEPT = 1\n' > /tmp/nr/r/ok.py
          # os.walk lists a FIFO like any other file, and open() on one with no
          # writer blocks forever, so the build stopped there and never came
          # back. There is no timeout to reach for: a pipe is not source code.
          mkfifo /tmp/nr/r/x.py
          timeout 60 where-are-we --repo /tmp/nr/r --out /tmp/nr/m --product none \
            --force --quiet --no-semantic
          grep -q KEPT /tmp/nr/m/framework_map.json
          grep -q "not a regular file" /tmp/nr/m/framework_map.md
          # Every artefact name is swept at the start of a build, not only the
          # ones this build writes: a kill during --html left its temporary
          # behind for good if the next build was run without --html.
          for n in framework_map.html spec_map.json spec_map.md \
                   semantic_index.npy .pointer-head; do
            : > "/tmp/nr/m/$n.99999.tmp"
          done
          : > "/tmp/nr/m/framework_map.md.$$.tmp"
          : > "/tmp/nr/m/notes.txt.99999.tmp"
          sleep 1.1
          printf 'KEPT = 2\n' > /tmp/nr/r/ok.py
          where-are-we --repo /tmp/nr/r --out /tmp/nr/m --product none --quiet --no-semantic
          # Gone: staged by a pid that no longer exists, under a name this
          # package writes.
          test -z "$(find /tmp/nr/m -name '*.99999.tmp' -name 'framework_map*')"
          test -z "$(find /tmp/nr/m -name 'spec_map*.99999.tmp')"
          test -z "$(find /tmp/nr/m -name 'semantic_index*.99999.tmp')"
          # Left alone: a live writer's temporary, and a name this package
          # never writes.
          test -f "/tmp/nr/m/framework_map.md.$$.tmp"
          test -f /tmp/nr/m/notes.txt.99999.tmp

      - name: the names two public modules call are public names
        run: |
          set -o pipefail
          rm -rf /tmp/pub
          mkdir -p /tmp/pub
          printf 'def charge(x):\n    return x\n' > /tmp/pub/billing.py
          # ask.py, lsp.py, mcp.py and hooks.py reached into the facade for
          # `_definitions_for` and `_fingerprint`: two underscore names that
          # four modules and a language server's documented line format
          # already depended on. They are public names now, and the old ones
          # are aliases of the same objects for one release.
          python - <<'EOF'
          from where_are_we import mapper
          for name in ("definitions_for", "fingerprint"):
              assert hasattr(mapper, name), name
          assert mapper.definitions_for is mapper._definitions_for
          assert mapper.fingerprint is mapper._fingerprint
          assert mapper.fingerprint("/tmp/pub").endswith(tuple("0123456789"))
          EOF
          # And the callers really call the public ones: no module outside the
          # facade and its aliases mentions the underscore spellings.
          if grep -rn "_definitions_for\|_fingerprint" src/where_are_we \
               --include='*.py' | grep -v "src/where_are_we/mapper.py" \
               | grep -v "_definitions_for = definitions_for" \
               | grep -v "_fingerprint = fingerprint" \
               | grep -v "^src/where_are_we/_mapper/walk.py:.*# " ; then
            echo "a caller still uses the deprecated underscore name"; exit 1
          fi

      - name: the command line is the outermost layer, and the graph has no cycles
        run: |
          set -o pipefail
          rm -rf /tmp/dip
          mkdir -p /tmp/dip/repo
          printf 'def charge(x):\n    return x\n' > /tmp/dip/repo/billing.py
          # 24 modules, no cycle. On the old layout `mapper` re-exported the
          # command line, which imported `ask`, `hooks`, `lsp` and `mcp`, each
          # of which imported `mapper` back, and eleven imports had to be
          # written inside functions to keep Python from tripping over it.
          python tests/golden/import_graph.py | tee /tmp/dip/graph.txt
          grep -q ", 0 cycles," /tmp/dip/graph.txt
          # None of those eleven is left: no module defers an import of the
          # facade, or of a module the facade can reach, to call time.
          python tests/golden/import_graph.py --verbose > /tmp/dip/edges.txt
          if grep -E "^deferred .* -> where_are_we\.(mapper|hooks|lsp|mcp|ask)( |$)" \
               /tmp/dip/edges.txt; then
            echo "an import is still deferred to dodge a cycle"; exit 1
          fi
          # Importing the map does not import the command line, the MCP server
          # or the language server: three programs the reader of a map never
          # runs.
          python -X importtime -c "import where_are_we.mapper" 2> /tmp/dip/imports.txt
          for name in where_are_we.cli where_are_we._mapper.cli where_are_we.mcp \
                      where_are_we.lsp where_are_we.hooks where_are_we.specs; do
            if grep -q " $name\$" /tmp/dip/imports.txt; then
              echo "importing the facade also imported $name"; exit 1
            fi
          done
          # And all three ways of running the tool still run it.
          where-are-we --repo /tmp/dip/repo --out /tmp/dip/m --quiet --no-semantic
          python -m where_are_we.mapper --repo /tmp/dip/repo --out /tmp/dip/m \
            --force --quiet --no-semantic
          python src/where_are_we/mapper.py --repo /tmp/dip/repo --out /tmp/dip/m \
            --force --quiet --no-semantic
          test -s /tmp/dip/m/framework_map_brief.md
          # The console script points at the module that owns argv.
          grep -q 'where-are-we = "where_are_we.cli:main"' pyproject.toml

      - name: a star import exports the shared names, and Ctx is really frozen
        run: |
          set -o pipefail
          python - <<'EOF'
          import inspect
          # `mapper.DEFINITIONS` worked and `from ... import *; DEFINITIONS`
          # raised NameError, because a star import goes by the module dict and
          # these eleven names are answered by an attribute hook. __all__ makes
          # the star import ask for them by name.
          ns = {}
          exec("from where_are_we.mapper import *", ns)
          for name in ("DEFINITIONS", "INDEXED", "LINES", "TRUNCATED", "CACHE_SCHEMA",
                       "PARSE_COUNT", "POINTER_MAX", "_FILE_CACHE", "_IGNORE_CACHE",
                       "_PARSE_CACHE", "_WALK_CACHE"):
              assert name in ns, name
          from where_are_we import mapper
          from where_are_we._mapper import state
          assert ns["DEFINITIONS"] is state.DEFINITIONS
          # Importing the map still does not import the command line: none of
          # its four names is in the star surface.
          for name in ("main", "init_manifest", "install_hook", "propose_docs"):
              assert name not in ns, name
          # Documented, not fixed: a static lookup skips __getattr__ by
          # definition, so a static reader takes these from _mapper.state.
          try:
              inspect.getattr_static(mapper, "DEFINITIONS")
              raise SystemExit("getattr_static now works; the note in mapper.py is stale")
          except AttributeError:
              pass
          EOF
          python - <<'EOF'
          from where_are_we._mapper.extract import Ctx
          c = Ctx(repo="/x", code_files=["a.py"], read=lambda rel, limit=1: "")
          # frozen=True used to freeze three bindings and nothing else: the one
          # field twenty extractors iterate was a mutable list they all shared.
          assert isinstance(c.code_files, tuple), type(c.code_files)
          assert hash(c) == hash(Ctx(repo="/x", code_files=("a.py",), read=c.read))
          try:
              c.code_files.append("X.py")
              raise SystemExit("code_files is still mutable")
          except AttributeError:
              pass
          EOF

      - name: two repositories in one process match two fresh processes
        run: |
          set -o pipefail
          rm -rf /tmp/purity
          mkdir -p /tmp/purity/a /tmp/purity/b
          printf 'ONLY_IN_A = 1\ndef shared_name():\n    pass\n' > /tmp/purity/a/alpha.py
          printf 'ONLY_IN_B = 1\ndef shared_name():\n    pass\n' > /tmp/purity/b/beta.py
          # The baseline is built by a process that maps one repository and
          # exits, which is the only run that cannot be carrying anything. The
          # step above this one compares in-process builds against in-process
          # builds, so a reset that never ran would look consistent from one
          # side.
          cat > /tmp/purity/one.py <<'EOF'
          import json, os, sys
          from where_are_we import mapper
          os.environ["PRODUCT_SRC"] = "none"
          out = []
          for repo in sys.argv[1:]:
              os.environ["AGENT_REPO"] = repo
              d = repo + ".out"
              os.makedirs(d, exist_ok=True)
              m = mapper.build(repo, out_dir=d)
              out.append({"definitions": sorted(m["definitions"]),
                          "indexed": m["indexed"]})
          print(json.dumps(out[-1], sort_keys=True))
          EOF
          A=/tmp/purity/a
          B=/tmp/purity/b
          python /tmp/purity/one.py $A > /tmp/purity/fresh-a.json
          python /tmp/purity/one.py $B > /tmp/purity/fresh-b.json
          python /tmp/purity/one.py $A $B > /tmp/purity/ab.json
          python /tmp/purity/one.py $B $A > /tmp/purity/ba.json
          diff /tmp/purity/fresh-b.json /tmp/purity/ab.json
          diff /tmp/purity/fresh-a.json /tmp/purity/ba.json
          # And the baseline really is one repository's own names, so the diffs
          # above are not two equal helpings of the same leak.
          grep -q ONLY_IN_A /tmp/purity/fresh-a.json
          if grep -q ONLY_IN_B /tmp/purity/fresh-a.json; then
            echo "a fresh build of A already carries B"; exit 1
          fi

      - name: no hook writer is handed a value it does not use
        run: |
          set -o pipefail
          rm -rf /tmp/isp
          mkdir -p /tmp/isp/repo /tmp/isp/home
          git -C /tmp/isp/repo init -q
          python - <<'EOF'
          import ast, inspect, json, sys
          from where_are_we import hooks
          bad = []
          # install() keeps its six parameters: it is the public entry point and
          # the CLI calls it by name. What stops here is threading all six on
          # into writers that need one or two: every kind is dispatched with
          # exactly what it reads, and the command line the two command-writing
          # kinds need is built once and passed as one string.
          for name in ("_install_git", "_install_claude", "_install_cursor",
                       "_install_codex", "_install_gemini"):
              fn = getattr(hooks, name)
              params = list(inspect.signature(fn).parameters)
              if len(params) > 2:
                  bad.append(f"{name} takes {len(params)} parameters: {params}")
              body = ast.parse(inspect.getsource(fn))
              read = {n.id for n in ast.walk(body) if isinstance(n, ast.Name)}
              for p in params:
                  if p not in read:
                      bad.append(f"{name} never reads its parameter {p}")
          print("\n".join(bad) or "every hook writer takes only what it reads")
          sys.exit(1 if bad else 0)
          EOF
          # And the two kinds that write a command still write the same one.
          python - <<'EOF'
          import json
          from where_are_we import hooks
          args = ("/tmp/isp/repo", "none", "/tmp/isp/out", "AGENTS.md")
          print(hooks.install(args[0], "git", *args[1:], home="/tmp/isp/home"))
          print(hooks.install(args[0], "claude", *args[1:], home="/tmp/isp/home"))
          git_line = [l for l in open("/tmp/isp/repo/.git/hooks/post-commit")
                      if "where-are-we" in l][0].strip()
          conf = json.load(open("/tmp/isp/home/.claude/settings.json"))
          claude_line = conf["hooks"]["SessionStart"][0]["hooks"][0]["command"]
          assert git_line == claude_line, (git_line, claude_line)
          assert git_line == ("where-are-we --repo /tmp/isp/repo --product none "
                              "--out /tmp/isp/out --agent-file AGENTS.md --quiet || true"), git_line
          EOF

      - name: the extractors are a registry, not twenty-one call sites
        run: |
          set -o pipefail
          rm -rf /tmp/ocp
          mkdir -p /tmp/ocp/repo
          printf 'import requests\n\ndef charge(user_id):\n    requests.post("https://x/y")\n    return user_id\n' \
            > /tmp/ocp/repo/billing.py
          where-are-we --repo /tmp/ocp/repo --out /tmp/ocp/m --product none \
            --force --quiet --no-semantic
          # build() called each extractor by name and unwrapped its dict into a
          # local, so a new topic meant editing a 2,400-line function twice.
          # Now there is one loop over one list.
          if grep -nE "extract\.(code|data|infra|tests)\." src/where_are_we/_mapper/build.py; then
            echo "build() still calls an extractor by name"; exit 1
          fi
          python - <<'EOF'
          import json, sys
          from where_are_we._mapper import extract
          m = json.load(open("/tmp/ocp/m/framework_map.json"))
          names = [n for n, _fn in extract.EXTRACTORS]
          assert len(extract.EXTRACTORS) == 20, len(extract.EXTRACTORS)
          assert len(set(names)) == 20, "a topic name is repeated"
          # Every key any of them returns is a key of the map, under the name
          # the extractor gave it.
          ctx = extract.Ctx(repo="/tmp/ocp/repo", code_files=("billing.py",),
                            read=lambda rel, limit=200000: open("/tmp/ocp/repo/" + rel).read())
          keys = set()
          for name, fn in extract.EXTRACTORS:
              got = fn(ctx)
              assert name in got, f"{fn.__name__} does not return its own topic {name}"
              keys |= set(got)
          missing = sorted(k for k in keys if k not in m)
          print(f"{len(extract.EXTRACTORS)} extractors, {len(keys)} map keys, missing: {missing}")
          sys.exit(1 if missing else 0)
          EOF
          # The one that would have been lost in the merge: `outbound` is found
          # by the registry's extractor and reaches the map.
          grep -q '"outbound"' /tmp/ocp/m/framework_map.json

      - name: the broad handlers that are left are the ones that should be
        run: |
          set -o pipefail
          rm -rf /tmp/pol
          mkdir -p /tmp/pol/r
          printf 'x = 1\n' > /tmp/pol/r/a.py
          # Nine broad handlers across the package, and each one is a server
          # loop, an optional dependency, or a third-party parser over a file
          # this package did not write. Every other one now names what it
          # catches, so a programming error in the lines it covers is a
          # traceback rather than a silently empty section.
          python - <<'EOF'
          import pathlib, re, sys
          allowed = {
              "semantic.py": 2,        # an optional index: no cache, no reranker
              "cli.py": 1,             # --watch outlives whatever the tree does
              "lsp.py": 1,             # keep serving the pipe
              "mcp.py": 1,             # keep serving the pipe
