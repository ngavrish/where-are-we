          # language it knows, so a .py fixture alone measured four of the
          # sixty-six and left a huge .ts costing 590 MB.
          python -c "open('/tmp/huge/r/huge.py','wb').write(b'x = 1\n' + b'# pad\n'*33000000)"
          python -c "open('/tmp/huge/r/huge.ts','wb').write(b'const x = 1\n' + b'// pad\n'*28000000)"
          ls -la /tmp/huge/r/
          python - <<'EOF'
          import resource, subprocess, sys
          subprocess.run(["where-are-we", "--repo", "/tmp/huge/r", "--out", "/tmp/huge/m",
                          "--product", "none", "--force", "--quiet", "--no-semantic"],
                         check=True)
          kb = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
          # ru_maxrss is kilobytes on Linux and bytes on macOS, and this has to
          # mean the same number on a developer's laptop as on the runner.
          if sys.platform == "darwin":
              kb //= 1024
          print(f"peak child RSS {kb / 1024:.0f} MB")
          # The fixture is 198 MB of .py plus 196 MB of .ts. Measured 30 MB
          # after the fix and 785 MB before it, so one whole copy of the
          # smaller file is a threshold with room on both sides.
          sys.exit(1 if kb > 190 * 1024 else 0)
          EOF

      - name: what changed comes back verbatim, whatever the file is called
        run: |
          rm -rf /tmp/cs
          mkdir -p /tmp/cs/r/pkg /tmp/cs/r/.wawe
          git -C /tmp/cs/r init -q
          git -C /tmp/cs/r config user.email t@t
          git -C /tmp/cs/r config user.name t
          printf 'x=1\n' > /tmp/cs/r/pkg/plain.py
          printf 'q=5\n' > "/tmp/cs/r/pkg/x -> y.py"
          git -C /tmp/cs/r add -A && git -C /tmp/cs/r commit -qm one
          # The first call only records HEAD; the second is the one that reports.
          python -c "
          from where_are_we._mapper.render import changed_since
          changed_since('/tmp/cs/r', '/tmp/cs/r/.wawe')"
          printf 'y=2\n' > "/tmp/cs/r/pkg/committed ünicode.py"
          git -C /tmp/cs/r add -A && git -C /tmp/cs/r commit -qm two
          git -C /tmp/cs/r mv "pkg/x -> y.py" "pkg/renamed -> z.py"
          printf 'z=3\n' > "/tmp/cs/r/pkg/café.py"
          printf 'v=6\n' > "/tmp/cs/r/pkg/a b.py"
          git -C /tmp/cs/r status --porcelain
          # Every path named has to be a path that exists. Parsing the text
          # form of git status kept git's own quoting and octal escapes, so
          # "pkg/café.py" was reported as the literal "pkg/caf\303\251.py",
          # and the rename of a file whose name contains " -> " came back as
          # the fragment 'z.py"'.
          python - <<'EOF'
          import os, sys
          from where_are_we._mapper.render import changed_since
          got = changed_since("/tmp/cs/r", "/tmp/cs/r/.wawe")
          missing = [p for p in got if not os.path.exists(os.path.join("/tmp/cs/r", p))]
          for p in got:
              print(repr(p))
          want = {"pkg/a b.py", "pkg/café.py", "pkg/committed ünicode.py",
                  "pkg/renamed -> z.py"}
          lost = sorted(want - set(got))
          print("does not exist:", missing, " not reported:", lost)
          sys.exit(1 if missing or lost else 0)
          EOF

      - name: a symlink out of the repository is not read into the map
        run: |
          rm -rf /tmp/esc
          mkdir -p /tmp/esc/r /tmp/esc/outside/secretdir /tmp/esc/m
          printf 'INSIDE_NAME = 1\n' > /tmp/esc/r/x.py
          printf 'SIBLING = 2\n' > /tmp/esc/r/sibling.py
          printf 'OUTSIDE_SECRET = "hunter2"\n' > /tmp/esc/outside/secretdir/creds.py
          ln -sf /etc/passwd /tmp/esc/r/passwd.py
          ln -sf /tmp/esc/outside/secretdir/creds.py /tmp/esc/r/linkfile.py
          ln -sf /tmp/esc/outside/secretdir /tmp/esc/r/linkdir
          # A link that stays inside the repository is still followed.
          ln -sf /tmp/esc/r/sibling.py /tmp/esc/r/inside_link.py
          where-are-we --repo /tmp/esc/r --out /tmp/esc/m --product none \
            --force --quiet --no-semantic
          ! grep -q "root:x:0:0" /tmp/esc/m/framework_map.json
          ! grep -q hunter2 /tmp/esc/m/framework_map.json
          ! grep -q OUTSIDE_SECRET /tmp/esc/m/framework_map.json
          grep -q INSIDE_NAME /tmp/esc/m/framework_map.json
          grep -q SIBLING /tmp/esc/m/framework_map.json
          grep -q "inside_link.py" /tmp/esc/m/framework_map.json
          # And the map says it left something out rather than looking complete.
          grep -q "a symlink in this tree resolves outside the repository" \
            /tmp/esc/m/framework_map.md

      - name: a broad handler no longer swallows what the parse loop does
        run: |
          rm -rf /tmp/nx
          mkdir -p /tmp/nx/r /tmp/nx/m
          printf 'def f():\n    pass\n' > /tmp/nx/r/a.py
          # A runs API that answers with a list holding one string and one
          # real row. The whole loop used to sit inside `except Exception`, so
          # row.get on the string raised AttributeError and the section came
          # back empty on an endpoint that had data in it.
          python - <<'EOF' &
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(["junk", {"id": "r1", "ticket": "AB-1",
                                              "verdict": "fail",
                                              "summary": "a real row"}]).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8731), H).serve_forever()
          EOF
          SRV=$!
          sleep 2
          where-are-we --repo /tmp/nx/r --out /tmp/nx/m --product none --force \
            --quiet --no-semantic --runs-api http://127.0.0.1:8731
          kill $SRV || true
          grep -q "a real row" /tmp/nx/m/framework_map.json
          # git history and blame still land, and a repository with no git at
          # all still builds: those are what the narrowed handlers are for.
          rm -rf /tmp/nx/g /tmp/nx/gm
          mkdir -p /tmp/nx/g
          git -C /tmp/nx/g init -q
          git -C /tmp/nx/g config user.email t@t
          git -C /tmp/nx/g config user.name "A Person"
          printf 'def f():\n    pass\n' > /tmp/nx/g/a.py
          git -C /tmp/nx/g add -A
          git -C /tmp/nx/g commit -qm "AB-42 first commit"
          where-are-we --repo /tmp/nx/g --out /tmp/nx/gm --product none --force \
            --quiet --no-semantic
          grep -q '"AB-42"' /tmp/nx/gm/framework_map.json
          grep -q "A Person" /tmp/nx/gm/framework_map.json
          where-are-we --repo /tmp/nx/r --out /tmp/nx/m --product none --force \
            --quiet --no-semantic
          # Only the borderline for-each-ref handler is still a broad one.
          test "$(grep -c 'except Exception' src/where_are_we/_mapper/build.py)" = "1"

      - name: an optional source that misbehaves does not end the build
        run: |
          rm -rf /tmp/opt
          mkdir -p /tmp/opt/r /tmp/opt/m
          printf 'def f():\n    pass\n' > /tmp/opt/r/a.py
          # --runs-api pointed at a socket that answers something that is not
          # HTTP. http.client.BadStatusLine is an HTTPException, which is not
          # an OSError, so it escaped every handler and ended a build over a
          # flag whose whole purpose is optional history.
          python - <<'EOF'
          import socket, subprocess, sys, threading
          srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("127.0.0.1", 0))
          port = srv.getsockname()[1]
          srv.listen(5)
          def serve():
              while True:
                  try:
                      c, _ = srv.accept()
                  except OSError:
                      return
                  try:
                      c.recv(4096)
                      c.sendall(b"GARBAGE NOT HTTP\r\n\r\n")
                  finally:
                      c.close()
          threading.Thread(target=serve, daemon=True).start()
          r = subprocess.run(["where-are-we", "--repo", "/tmp/opt/r", "--out", "/tmp/opt/m",
                              "--product", "none", "--force", "--quiet", "--no-semantic",
                              "--runs-api", f"http://127.0.0.1:{port}"],
                             capture_output=True, text=True)
          print("exit:", r.returncode)
          print(r.stderr[-400:])
          sys.exit(0 if r.returncode == 0 else 1)
          EOF
          test -s /tmp/opt/m/framework_map.md
          # A git author whose name is not ASCII, read under a C locale.
          # text=True decodes with the locale, so this raised UnicodeDecodeError
          # out of subprocess itself and no handler named it.
          rm -rf /tmp/opt/g /tmp/opt/gm
          mkdir -p /tmp/opt/g
          git -C /tmp/opt/g init -q
          git -C /tmp/opt/g config user.email t@t
          git -C /tmp/opt/g config user.name "Renée Müller"
          printf 'def f():\n    pass\n' > /tmp/opt/g/a.py
          git -C /tmp/opt/g add -A
          git -C /tmp/opt/g commit -qm "AB-42 café support"
          LC_ALL=C LANG=C PYTHONCOERCECLOCALE=0 PYTHONUTF8=0 \
            where-are-we --repo /tmp/opt/g --out /tmp/opt/gm --product none \
            --force --quiet --no-semantic
          # git emits UTF-8 whatever the locale is, so the name is not merely
          # survived, it is exact.
          python -c "
          import json
          d = json.load(open('/tmp/opt/gm/framework_map.json'))
          assert d['blame_owners'] == {'a.py': ['Renée Müller (1)']}, d['blame_owners']
          assert 'AB-42' in d['ticket_links'], d['ticket_links']
          print('blame and tickets intact under LC_ALL=C:', d['blame_owners'])"
          # And no handler reaches for a module that only its try block imports.
          grep -n "^import subprocess" src/where_are_we/_mapper/build.py
          grep -n "^import http.client" src/where_are_we/_mapper/build.py
          test "$(grep -c '        import subprocess' src/where_are_we/_mapper/build.py)" = "0"

      - name: the fingerprint watches exactly the files the map indexes
        run: |
          rm -rf /tmp/fpx
          mkdir -p /tmp/fpx/r /tmp/fpx/m
          # Nine languages the map indexes and the fingerprint used to ignore.
          # Editing one of them moved the map's contents and not its
          # fingerprint, so the next build said "unchanged since it was built"
          # and served the old answer.
          printf 'package m\n\nfunc ORIGINAL_GO() {}\n' > /tmp/fpx/r/main.go
          printf 'pub fn ORIGINAL_RS() {}\n' > /tmp/fpx/r/lib.rs
          printf 'fun ORIGINAL_KT() {}\n' > /tmp/fpx/r/App.kt
          printf 'public class ORIGINAL_CS {}\n' > /tmp/fpx/r/App.cs
          printf 'def ORIGINAL_RB\nend\n' > /tmp/fpx/r/app.rb
          where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none \
            --force --quiet --no-semantic
          grep -q ORIGINAL_GO /tmp/fpx/m/framework_map.json
          for pair in "main.go:package m\n\nfunc EDITED_GO() {}\n:EDITED_GO:ORIGINAL_GO" \
                      "lib.rs:pub fn EDITED_RS() {}\n:EDITED_RS:ORIGINAL_RS" \
                      "App.kt:fun EDITED_KT() {}\n:EDITED_KT:ORIGINAL_KT" \
                      "App.cs:public class EDITED_CS {}\n:EDITED_CS:ORIGINAL_CS" \
                      "app.rb:def EDITED_RB\nend\n:EDITED_RB:ORIGINAL_RB"; do
            file=${pair%%:*}; rest=${pair#*:}
            body=${rest%%:*}; rest=${rest#*:}
            want=${rest%%:*}; gone=${rest#*:}
            sleep 1.1
            printf "$body" > /tmp/fpx/r/$file
            where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none \
              --no-semantic | tee /tmp/fpx/out.txt
            ! grep -q "unchanged since it was built" /tmp/fpx/out.txt
            grep -q "$want" /tmp/fpx/m/framework_map.json
            ! grep -q "$gone" /tmp/fpx/m/framework_map.json
          done
          # A tree nobody touched still does not rebuild.
          where-are-we --repo /tmp/fpx/r --out /tmp/fpx/m --product none --no-semantic \
            | grep -q "unchanged since it was built"
          # And an ignored directory is pruned by the walk as well as by the
          # fingerprint, so a bare directory name in .gitignore means what it
          # means to git: at any depth.
          rm -rf /tmp/fpx/ig /tmp/fpx/igm
          mkdir -p /tmp/fpx/ig/pkg/generated
          printf 'build_output/\n' > /tmp/fpx/ig/.gitignore
          mkdir -p /tmp/fpx/ig/pkg/build_output
          printf 'KEPT_NAME = 1\n' > /tmp/fpx/ig/pkg/a.py
          printf 'IGNORED_NAME = 1\n' > /tmp/fpx/ig/pkg/build_output/b.py
          where-are-we --repo /tmp/fpx/ig --out /tmp/fpx/igm --product none \
            --force --quiet --no-semantic
          grep -q KEPT_NAME /tmp/fpx/igm/framework_map.json
          ! grep -q IGNORED_NAME /tmp/fpx/igm/framework_map.json

      - name: a pipe does not hang the build, and dead temporaries are swept
        run: |
          rm -rf /tmp/nr
          mkdir -p /tmp/nr/r /tmp/nr/m
          printf 'KEPT = 1\n' > /tmp/nr/r/ok.py
          # os.walk lists a FIFO like any other file, and open() on one with no
          # writer blocks forever, so the build stopped there and never came
          # back. There is no timeout to reach for: a pipe is not source code.
          mkfifo /tmp/nr/r/x.py
          timeout 60 where-are-we --repo /tmp/nr/r --out /tmp/nr/m --product none \
            --force --quiet --no-semantic
          grep -q KEPT /tmp/nr/m/framework_map.json
          grep -q "not a regular file" /tmp/nr/m/framework_map.md
          # Every artefact name is swept at the start of a build, not only the
          # ones this build writes: a kill during --html left its temporary
          # behind for good if the next build was run without --html.
          for n in framework_map.html spec_map.json spec_map.md \
                   semantic_index.npy .pointer-head; do
            : > "/tmp/nr/m/$n.99999.tmp"
          done
          : > "/tmp/nr/m/framework_map.md.$$.tmp"
          : > "/tmp/nr/m/notes.txt.99999.tmp"
          sleep 1.1
          printf 'KEPT = 2\n' > /tmp/nr/r/ok.py
          where-are-we --repo /tmp/nr/r --out /tmp/nr/m --product none --quiet --no-semantic
          # Gone: staged by a pid that no longer exists, under a name this
          # package writes.
          test -z "$(find /tmp/nr/m -name '*.99999.tmp' -name 'framework_map*')"
          test -z "$(find /tmp/nr/m -name 'spec_map*.99999.tmp')"
          test -z "$(find /tmp/nr/m -name 'semantic_index*.99999.tmp')"
          # Left alone: a live writer's temporary, and a name this package
          # never writes.
          test -f "/tmp/nr/m/framework_map.md.$$.tmp"
          test -f /tmp/nr/m/notes.txt.99999.tmp
