      - name: an accented filename does not take --pointer down under an ascii locale
        run: |
          set -o pipefail
          rm -rf /tmp/acc
          mkdir -p /tmp/acc/repo
          git -C /tmp/acc/repo init -q
          git -C /tmp/acc/repo config user.email t@t
          git -C /tmp/acc/repo config user.name t
          printf 'def cafe_login():\n    pass\n' > /tmp/acc/repo/café.py
          git -C /tmp/acc/repo add -A
          git -C /tmp/acc/repo commit -qm one
          where-are-we --repo /tmp/acc/repo --out /tmp/acc/m --product none \
            --force --quiet --no-semantic
          # Records the head this session started from.
          where-are-we --repo /tmp/acc/repo --out /tmp/acc/m --pointer > /dev/null
          printf 'def other():\n    pass\n' > /tmp/acc/repo/naïve.py
          git -C /tmp/acc/repo add -A
          git -C /tmp/acc/repo commit -qm two
          # `git diff --name-only -z` hands back a path exactly as it is on
          # disk. subprocess's text=True decodes it with the locale's codec,
          # which under LC_ALL=C is ascii, and the UnicodeDecodeError that
          # raised came out of subprocess itself: `--pointer` exited 1 on any
          # repository with one accented filename in it.
          LC_ALL=C PYTHONUTF8=0 PYTHONCOERCECLOCALE=0 \
            where-are-we --repo /tmp/acc/repo --out /tmp/acc/m --pointer \
            > /tmp/acc/ptr.txt 2>/tmp/acc/ptr.err
          grep -q "framework map" /tmp/acc/ptr.txt
          if grep -q "UnicodeDecodeError" /tmp/acc/ptr.err; then
            echo "unexpected match: grep -q 'UnicodeDecodeError' /tmp/acc/ptr.err"; exit 1
          fi
          # And the note is still made: the path is decoded with a named codec
          # that replaces what it cannot carry, rather than not read at all.
          grep -q "Since the last session 1 file changed" /tmp/acc/ptr.txt

