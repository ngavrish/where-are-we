# This repository is built into the stack, so a merge here changes what is
# running. What deploying means lives in chiron-actions; this only says that this
# repository wants it.
name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ngavrish/chiron-actions/.github/workflows/deploy.yml@main
    with:
      from: ${{ github.repository }}
