name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # What was published, and proof it was this workflow that published it.
      # Keyless: the signature is bound to this repository and this tag through
      # the OIDC identity, so there is no key to lose.
      - uses: sigstore/cosign-installer@v3
      - name: sign the artefacts
        run: |
          for f in dist/*; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" --output-certificate "$f.pem"
          done

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: where-are-we.spdx.json

      - name: attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/* where-are-we.spdx.json --clobber
