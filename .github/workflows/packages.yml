name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: version
        id: v
        run: echo "version=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")" >> $GITHUB_OUTPUT

      - name: build the deb
        run: |
          V=${{ steps.v.outputs.version }}
          ROOT=$(mktemp -d)
          mkdir -p $ROOT/usr/lib/where-are-we/where_are_we
          # Every module: __init__ imports mapper, and mapper imports specs,
          # semantic and mcp. Shipping only three of them is the circular-import
          # crash the deb smoke test hit on every release. `_mapper/` and its
          # `extract/` are where mapper.py's own implementation lives, so the
          # copy is recursive: a flat glob ships a facade with nothing behind it.
          cp -R src/where_are_we/. $ROOT/usr/lib/where-are-we/where_are_we/
          find $ROOT/usr/lib/where-are-we -name __pycache__ -type d -exec rm -rf {} +
          find $ROOT/usr/lib/where-are-we -type f -exec chmod 644 {} +
          find $ROOT/usr/lib/where-are-we -type d -exec chmod 755 {} +
          install -Dm644 LICENSE $ROOT/usr/share/doc/where-are-we/copyright
          mkdir -p $ROOT/usr/bin $ROOT/DEBIAN
          cat > $ROOT/usr/bin/where-are-we <<'SH'
          #!/bin/sh
          exec python3 -c 'import sys; sys.path.insert(0, "/usr/lib/where-are-we"); from where_are_we.mapper import main; sys.exit(main())' "$@"
          SH
          cat > $ROOT/usr/bin/wawe-readmes <<'SH'
          #!/bin/sh
          exec python3 -c 'import sys; sys.path.insert(0, "/usr/lib/where-are-we"); from where_are_we.readmes import main; sys.exit(main())' "$@"
          SH
          cat > $ROOT/usr/bin/wawe-measure <<'SH'
          #!/bin/sh
          exec python3 -c 'import sys; sys.path.insert(0, "/usr/lib/where-are-we"); from where_are_we.measure import main; sys.exit(main())' "$@"
          SH
          chmod 755 $ROOT/usr/bin/where-are-we $ROOT/usr/bin/wawe-readmes $ROOT/usr/bin/wawe-measure
          cat > $ROOT/DEBIAN/control <<CTRL
          Package: where-are-we
          Version: $V
          Section: devel
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.12)
          Maintainer: BoberIT <apt@where-are-we.dev>
          Description: Index a codebase into a map an agent can read
           Answers "where are we?" for a repository: layers, entry points, routes,
           data model, contracts, tests and the state of the code itself — derived
           from the tree in seconds, with no model involved.
          CTRL
          dpkg-deb --build --root-owner-group $ROOT where-are-we_${V}_all.deb
          dpkg-deb -I where-are-we_${V}_all.deb | head -12

      - name: smoke test the deb
        run: |
          sudo dpkg -i where-are-we_*.deb
          where-are-we --repo . --out /tmp/map --quiet
          test -s /tmp/map/framework_map_brief.md

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp where-are-we_*.deb where-are-we_all.deb   # a stable name for /latest/download
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --generate-notes --verify-tag \
            || gh release view "$TAG" -R "$REPO" >/dev/null
          gh release upload "$TAG" where-are-we_*.deb -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build the rpm
        run: |
          dnf install -y -q rpm-build python3 >/dev/null
          V=$(python3 -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} pkg/usr/lib/where-are-we/where_are_we pkg/usr/bin
          # Recursive: mapper.py is a facade over `_mapper/`, and a flat glob
          # would ship it with nothing behind it.
          cp -R src/where_are_we/. pkg/usr/lib/where-are-we/where_are_we/
          find pkg/usr/lib/where-are-we -name __pycache__ -type d -exec rm -rf {} +
          for cmd in where-are-we:mapper wawe-readmes:readmes wawe-measure:measure; do
            name=${cmd%%:*}; mod=${cmd##*:}
            printf '#!/bin/sh\nexec python3 -c '"'"'import sys; sys.path.insert(0, "/usr/lib/where-are-we"); from where_are_we.%s import main; sys.exit(main())'"'"' "$@"\n' "$mod" > pkg/usr/bin/$name
            chmod 755 pkg/usr/bin/$name
          done
          cat > ~/rpmbuild/SPECS/where-are-we.spec <<SPEC
          Name:           where-are-we
          Version:        $V
          Release:        1
          Summary:        Index a codebase into a map an agent can read
          License:        MIT
          URL:            https://github.com/ngavrish/where-are-we
          BuildArch:      noarch
          Requires:       python3 >= 3.12
          %description
          Answers "where are we?" for a repository: layers, entry points, routes,
          data model, contracts, tests and the state of the code itself, derived
          from the tree in seconds with no model involved.
          %install
          mkdir -p %{buildroot}
          cp -a $PWD/pkg/* %{buildroot}/
          %files
          /usr/bin/where-are-we
          /usr/bin/wawe-readmes
          /usr/bin/wawe-measure
          /usr/lib/where-are-we
          %changelog
          SPEC
          rpmbuild -bb ~/rpmbuild/SPECS/where-are-we.spec
          cp ~/rpmbuild/RPMS/noarch/*.rpm .

      - name: install it as a user would, and map with it
        run: |
          dnf install -y -q ./where-are-we-*.rpm
          mkdir -p /tmp/probe/steps
          printf 'from behave import step\n@step("a user exists")\ndef f(c):\n    pass\n' > /tmp/probe/steps/a.py
          where-are-we --repo /tmp/probe --out /tmp/map
          grep -q "step" /tmp/map/framework_map_brief.md

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: "*.rpm"

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dnf install -y -q gh
          # -R names the repo so gh needs no local git: the fedora container's
          # checkout is not a discoverable git dir, which is what 'not a git
          # repository' was.
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --generate-notes --verify-tag \
            || gh release view "$TAG" -R "$REPO" >/dev/null
          gh release upload "$TAG" where-are-we-*.rpm -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  apt-repo:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: incoming
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: incoming-rpm

      - name: build a signed apt repository
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev gnupg
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          mkdir -p repo/pool/main repo/dists/stable/main/binary-all
          cp incoming/*.deb repo/pool/main/
          cd repo
          dpkg-scanpackages --arch all pool/ > dists/stable/main/binary-all/Packages
          gzip -9fk dists/stable/main/binary-all/Packages
          cat > dists/stable/Release <<REL
          Origin: where-are-we
          Label: where-are-we
          Suite: stable
          Codename: stable
          Architectures: all
          Components: main
          Description: where-are-we packages
          Date: $(date -Ru)
          REL
          apt-ftparchive release dists/stable >> dists/stable/Release
          gpg --batch --yes --default-key ${{ secrets.APT_GPG_KEY_ID }} \
              --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --default-key ${{ secrets.APT_GPG_KEY_ID }} \
              -abs -o dists/stable/Release.gpg dists/stable/Release
          cp ../packaging/apt-key.asc .
          cp ../packaging/index.html . 2>/dev/null || true
          cp ../packaging/install.sh . && chmod +x install.sh
          # The same Pages host carries a yum repository: one origin, both
          # package managers, one key.
          sudo apt-get install -y -qq createrepo-c
          mkdir -p rpm
          cp ../incoming-rpm/*.rpm rpm/
          createrepo_c rpm >/dev/null
          gpg --batch --yes --default-key ${{ secrets.APT_GPG_KEY_ID }} \
              --detach-sign --armor rpm/repodata/repomd.xml
          cat > where-are-we.repo <<REPO
          [where-are-we]
          name=where-are-we
          baseurl=https://ngavrish.github.io/where-are-we/rpm
          enabled=1
          gpgcheck=0
          repo_gpgcheck=1
          gpgkey=https://ngavrish.github.io/where-are-we/apt-key.asc
          REPO

      - name: publish to Pages branch
        run: |
          git config user.name "where-are-we release"
          git config user.email apt@where-are-we.dev
          # docs/demo lives on main; the orphan checkout below wipes the
          # working tree, so it is copied out first and put back under
          # demo/ once the apt/rpm repository is in place. Guarded both
          # ways: a ref tagged before docs/demo existed must still publish
          # the apt/rpm repository, not abort here.
          [ -d docs/demo ] && cp -a docs/demo /tmp/demo || true
          git checkout --orphan gh-pages
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name repo ! -name .git ! -name . -exec rm -rf {} +
          mv repo/* . && rmdir repo
          [ -d /tmp/demo ] && { rm -rf demo && mv /tmp/demo demo; } || true
          git add -A && git commit -qm "apt repository for ${{ github.ref_name }}"
          git push -qf origin gh-pages

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ngavrish/where-are-we:latest
            ghcr.io/ngavrish/where-are-we:${{ github.ref_name }}

  install-matrix:
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: install the package as a user would
        run: |
          apt-get update -qq
          apt-get install -y -qq ./where-are-we_*.deb
          mkdir -p /tmp/probe/steps
          printf 'from behave import step\n@step("a user exists")\ndef f(c):\n    pass\n' > /tmp/probe/steps/a.py
          where-are-we --repo /tmp/probe --out /tmp/map
          grep -q "step" /tmp/map/framework_map_brief.md
